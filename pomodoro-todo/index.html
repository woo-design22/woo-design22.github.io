<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뽀모도로 + 할 일</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #22223b;
    --accent: #f25c54;
    --accent2: #4cc9f0;
    --text: #e9ecef;
    --muted: #9a9ab0;
    --done: #4caf50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #232342, #14141f);
    color: var(--text);
    font-family: 'Segoe UI', Pretendard, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app { width: 100%; max-width: 460px; }
  h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  .timer-card {
    background: var(--card);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 24px;
  }
  .mode-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .mode-tabs button {
    background: transparent;
    border: 1px solid #3a3a5c;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all .2s;
  }
  .mode-tabs button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .time-display {
    font-size: 3.4rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 12px 0;
    font-variant-numeric: tabular-nums;
  }
  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 16px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #33334f; stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .session-count { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

  .controls { display: flex; justify-content: center; gap: 10px; }
  .controls button {
    border: none;
    border-radius: 12px;
    padding: 10px 22px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
  }
  #startBtn { background: var(--accent); color: white; }
  #resetBtn { background: #33334f; color: var(--text); }

  .todo-card {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .todo-card h2 { font-size: 1.05rem; margin: 0 0 14px; }
  .todo-input { display: flex; gap: 8px; margin-bottom: 14px; }
  .todo-input input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #3a3a5c;
    background: #14141f;
    color: var(--text);
    font-size: 0.9rem;
  }
  .todo-input button {
    background: var(--accent2);
    color: #0b1e26;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 700;
    cursor: pointer;
  }
  ul#todoList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul#todoList li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1c1c30;
    padding: 10px 12px;
    border-radius: 10px;
  }
  ul#todoList li.done .task-text { text-decoration: line-through; color: var(--muted); }
  ul#todoList li .task-text { flex: 1; font-size: 0.9rem; cursor: pointer; }
  ul#todoList li .pomo-count { font-size: 0.75rem; color: var(--muted); background: #14141f; padding: 2px 8px; border-radius: 999px; }
  ul#todoList li button.del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
  }
  ul#todoList li button.del:hover { color: var(--accent); }
  ul#todoList li input[type=checkbox] { accent-color: var(--done); width: 16px; height: 16px; }
  .empty { color: var(--muted); text-align: center; font-size: 0.85rem; padding: 10px 0; }
  .active-task { text-align: center; color: var(--accent2); font-size: 0.8rem; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<div class="app">
  <h1>🍅 포커스 타이머</h1>
  <div class="subtitle">뽀모도로 기법으로 집중하고, 할 일을 정리하세요</div>

  <div class="timer-card">
    <div class="mode-tabs">
      <button data-mode="focus" class="active">집중 25분</button>
      <button data-mode="short">짧은 휴식 5분</button>
      <button data-mode="long">긴 휴식 15분</button>
    </div>

    <div class="ring-wrap">
      <svg width="220" height="220">
        <circle class="ring-bg" cx="110" cy="110" r="95"></circle>
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="95"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="session-count" id="sessionCount">완료한 집중 세션: 0</div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn">초기화</button>
    </div>
    <div class="active-task" id="activeTaskLabel"></div>
  </div>

  <div class="todo-card">
    <h2>📋 할 일</h2>
    <div class="todo-input">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" maxlength="80">
      <button id="addBtn">추가</button>
    </div>
    <ul id="todoList"></ul>
    <div class="empty" id="emptyMsg">할 일이 없습니다. 위에서 추가해보세요.</div>
  </div>
</div>

<script>
(function () {
  const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  let mode = 'focus';
  let remaining = DURATIONS[mode];
  let timerId = null;
  let running = false;
  // file:// 이나 쿠키 차단 환경에서 localStorage 접근이 예외를 던져도
  // 앱 전체가 멈추지 않도록 감싼다.
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  };

  let sessionsCompleted = Number(store.get('pomo_sessions') || 0);
  let activeTaskId = store.get('pomo_activeTask') || null;

  const timeDisplay = document.getElementById('timeDisplay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionCountEl = document.getElementById('sessionCount');
  const ringFg = document.getElementById('ringFg');
  const modeButtons = document.querySelectorAll('.mode-tabs button');
  const activeTaskLabel = document.getElementById('activeTaskLabel');

  const RADIUS = 95;
  const CIRC = 2 * Math.PI * RADIUS;
  ringFg.style.strokeDasharray = CIRC;

  function updateRing() {
    const total = DURATIONS[mode];
    const frac = remaining / total;
    ringFg.style.strokeDashoffset = CIRC * (1 - frac);
  }

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function render() {
    timeDisplay.textContent = formatTime(remaining);
    sessionCountEl.textContent = `완료한 집중 세션: ${sessionsCompleted}`;
    updateRing();
  }

  function setMode(newMode) {
    mode = newMode;
    remaining = DURATIONS[mode];
    pause();
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === newMode));
    render();
  }

  function tick() {
    if (remaining <= 0) {
      pause();
      if (mode === 'focus') {
        sessionsCompleted++;
        store.set('pomo_sessions', sessionsCompleted);
        if (activeTaskId) bumpPomoCount(activeTaskId);
        notify('집중 세션 완료! 잠시 휴식하세요.');
        setMode('short');
      } else {
        notify('휴식 종료! 다시 집중해볼까요?');
        setMode('focus');
      }
      return;
    }
    remaining--;
    render();
  }

  function notify(msg) {
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        new Notification(msg);
      }
    } catch (e) {}
    document.title = msg;
    setTimeout(() => { document.title = '뽀모도로 + 할 일'; }, 3000);
  }

  function play() {
    if (running) return;
    running = true;
    startBtn.textContent = '일시정지';
    timerId = setInterval(tick, 1000);
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  function pause() {
    running = false;
    startBtn.textContent = '시작';
    clearInterval(timerId);
  }

  startBtn.addEventListener('click', () => running ? pause() : play());
  resetBtn.addEventListener('click', () => { remaining = DURATIONS[mode]; pause(); render(); });
  modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

  // ---- Todo list ----
  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const emptyMsg = document.getElementById('emptyMsg');

  let todos;
  try {
    todos = JSON.parse(store.get('pomo_todos') || '[]');
  } catch (e) {
    todos = [];
  }

  function saveTodos() {
    store.set('pomo_todos', JSON.stringify(todos));
  }

  function bumpPomoCount(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.pomoCount = (t.pomoCount || 0) + 1; saveTodos(); renderTodos(); }
  }

  function renderTodos() {
    todoList.innerHTML = '';
    emptyMsg.style.display = todos.length ? 'none' : 'block';
    todos.forEach(t => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      if (t.id === activeTaskId) li.style.outline = '1px solid #4cc9f0';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.addEventListener('change', () => { t.done = cb.checked; saveTodos(); renderTodos(); });

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = t.text;
      span.title = '클릭해서 현재 집중 작업으로 지정';
      span.addEventListener('click', () => {
        activeTaskId = (activeTaskId === t.id) ? null : t.id;
        store.set('pomo_activeTask', activeTaskId || '');
        renderTodos();
        updateActiveLabel();
      });

      const pomoBadge = document.createElement('span');
      pomoBadge.className = 'pomo-count';
      pomoBadge.textContent = `🍅 ${t.pomoCount || 0}`;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', () => {
        todos = todos.filter(x => x.id !== t.id);
        if (activeTaskId === t.id) activeTaskId = null;
        saveTodos();
        renderTodos();
        updateActiveLabel();
      });

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(pomoBadge);
      li.appendChild(del);
      todoList.appendChild(li);
    });
  }

  function updateActiveLabel() {
    const t = todos.find(t => t.id === activeTaskId);
    activeTaskLabel.textContent = t ? `현재 집중 작업: ${t.text}` : '';
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ id: Date.now().toString(36), text, done: false, pomoCount: 0 });
    todoInput.value = '';
    saveTodos();
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  renderTodos();
  updateActiveLabel();
  render();
})();
</script>
</body>
</html>
