<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>남산중 6인방</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b1a2e'/%3E%3Crect x='5' y='2' width='6' height='3' fill='%23222'/%3E%3Crect x='5' y='5' width='6' height='4' fill='%23f1c7a3'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23222'/%3E%3Crect x='9' y='6' width='1' height='1' fill='%23222'/%3E%3Crect x='4' y='9' width='8' height='4' fill='%23d94b4b'/%3E%3Crect x='5' y='13' width='2' height='2' fill='%23345'/%3E%3Crect x='9' y='13' width='2' height='2' fill='%23345'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #1b1a2e;
  --stage-bg: #0e0d1a;
  --panel: #2a2942;
  --panel-edge: #6d6a9a;
  --text: #f4f1ff;
  --muted: #a7a3c9;
  --accent: #ffd166;
  --accent-2: #7bd389;
  --danger: #ef6f6c;
  --pad: #35345a;
  --pad-press: #575593;
  --btn-a: #d94b4b;
  --btn-b: #3f7fd9;
  --dlg: rgba(18, 17, 34, 0.96);
  --dlg-edge: #ffffff;
  --shadow: rgba(0,0,0,0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', Pretendard, sans-serif; overflow: hidden;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; }

#app {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  max-width: 560px; margin: 0 auto;
}
#stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--stage-bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  touch-action: none;
}
#cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* 상단 표시: 현재 친구 + 목표 */
#hud {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start;
  gap: 6px; padding: 6px; pointer-events: none; font-size: 13px;
}
#hud .who {
  background: var(--dlg); border: 2px solid var(--dlg-edge); border-radius: 6px;
  padding: 4px 8px; line-height: 1.3; max-width: 78%; box-shadow: 0 2px 0 var(--shadow);
}
#hud .who b { color: var(--accent); }
#hud .who span { color: var(--muted); display: block; font-size: 12px; }
#hud .menu + .menu { margin-left: 6px !important; }
#hud .menu {
  margin-left: auto; pointer-events: auto; background: var(--dlg); color: var(--text);
  border: 2px solid var(--dlg-edge); border-radius: 6px; width: 36px; height: 32px;
  font-size: 18px; line-height: 1; cursor: pointer; box-shadow: 0 2px 0 var(--shadow);
}

/* 대화창 */
#dlg {
  position: absolute; left: 6px; right: 6px; bottom: 6px; display: none;
  background: var(--dlg); border: 3px solid var(--dlg-edge); border-radius: 8px;
  padding: 10px 12px 12px; min-height: 88px; font-size: 16px; line-height: 1.45;
  box-shadow: 0 3px 0 var(--shadow); cursor: pointer;
}
#dlg.show { display: block; }
#dlg .name { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 3px; }
#dlg .text { white-space: pre-wrap; word-break: keep-all; }
#dlg .more { position: absolute; right: 10px; bottom: 6px; color: var(--accent); animation: bob 0.7s infinite alternate; }
#dlg .more.hide { display: none; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(3px); } }
#choices { display: none; margin-top: 8px; flex-direction: column; gap: 6px; }
#choices.show { display: flex; }
#choices button {
  text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--panel-edge);
  border-radius: 6px; padding: 8px 10px; font-size: 15px; cursor: pointer;
}
#choices button.sel, #choices button:active { background: var(--pad-press); border-color: var(--accent); }

/* 건물 이름표 (캔버스 위 DOM — 저해상도 캔버스보다 글자가 또렷하다) */
#labels { position: absolute; overflow: hidden; pointer-events: none; left: 0; top: 0; }
#labels .lb {
  position: absolute; transform: translate(-50%, -100%); background: rgba(18,17,34,0.82); color: #fff;
  font-size: 11px; line-height: 1.15; padding: 2px 6px 3px; border-radius: 4px; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.4);
}
#labels .lb.exit { background: rgba(255,209,102,0.94); color: #2a1d00; font-weight: 700; border-color: #fff1c2; }

/* 미니맵 */
#mini { position: absolute; right: 6px; top: 44px; image-rendering: pixelated; border: 2px solid var(--dlg-edge); border-radius: 4px; background: #0e0d1a; opacity: 0.92; }

/* 사진 연출 (추억 사진 몇 초 보여주기) */
#photo {
  position: absolute; inset: 0; z-index: 9; background: #000; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 16px; opacity: 0; transition: opacity 0.35s;
}
#photo.on { display: flex; }
#photo.show { opacity: 1; }
#photo img { max-width: 100%; max-height: 78%; border: 3px solid #fff; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
#photoCap { color: #fff; font-size: 15px; text-align: center; white-space: pre-line; line-height: 1.5; word-break: keep-all; }

/* 미니게임(샐러드 쌓기) 오버레이 */
#mg {
  position: absolute; inset: 0; z-index: 7; background: rgba(10,9,20,0.93); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 10px; touch-action: none;
}
#mg.show { display: flex; }
#mgCv { image-rendering: pixelated; border: 3px solid var(--dlg-edge); border-radius: 8px; background: #17162c; }
#mgInfo { color: var(--text); font-size: 14px; text-align: center; white-space: pre-line; line-height: 1.5; }

/* 전환 페이드 */
#fade {
  position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
#fade.on { opacity: 1; }

/* 토스트(짧은 알림) */
#toast {
  position: absolute; left: 50%; top: 52px; transform: translateX(-50%); display: none;
  background: var(--accent); color: #2a1d00; font-weight: 700; font-size: 14px;
  padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); white-space: nowrap;
}
#toast.show { display: block; animation: toastin 2.2s forwards; }
@keyframes toastin { 0% { opacity: 0; transform: translate(-50%, -6px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* 가상 패드 */
#pad {
  flex: 0 0 auto; height: 186px; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; touch-action: none; background: var(--bg);
}
#dpad { position: relative; width: 156px; height: 156px; }
#dpad .k {
  position: absolute; width: 52px; height: 52px; background: var(--pad); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px;
  box-shadow: 0 3px 0 var(--shadow);
}
#dpad .k.on { background: var(--pad-press); color: var(--text); transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
#dpad .up { left: 52px; top: 0; } #dpad .down { left: 52px; top: 104px; }
#dpad .left { left: 0; top: 52px; } #dpad .right { left: 104px; top: 52px; }
#dpad .mid { left: 52px; top: 52px; background: var(--panel); box-shadow: none; border-radius: 0; }
#btns { display: flex; gap: 14px; align-items: flex-end; }
#btns button {
  width: 68px; height: 68px; border-radius: 50%; border: 0; color: #fff; font-weight: 800; font-size: 18px;
  box-shadow: 0 4px 0 var(--shadow); cursor: pointer; touch-action: none;
}
#btns button small { display: block; font-size: 10px; font-weight: 600; opacity: 0.85; }
#btnA { background: var(--btn-a); }
#btns #btnB { background: var(--btn-b); width: 56px; height: 56px; font-size: 15px; margin-bottom: 4px; }
#btns button.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }

/* 전체 화면 스크린(타이틀·친구 선택·메뉴·엔딩) */
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; padding: 20px; background: var(--bg); z-index: 5; overflow: auto;
  text-align: center;
}
.screen.show { display: flex; }
.screen h1 {
  margin: 0; font-size: 40px; letter-spacing: 2px; color: var(--accent);
  text-shadow: 3px 3px 0 #7a3b00, 6px 6px 0 rgba(0,0,0,0.4); line-height: 1.1;
}
.screen h1 small { display: block; font-size: 15px; letter-spacing: 6px; color: var(--muted); text-shadow: none; margin-bottom: 6px; }
.screen p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; word-break: keep-all; }
.screen .big {
  background: var(--panel); color: var(--text); border: 3px solid var(--panel-edge); border-radius: 10px;
  padding: 12px 28px; font-size: 18px; font-weight: 700; min-width: 200px; cursor: pointer; box-shadow: 0 4px 0 var(--shadow);
}
.screen .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.screen .big.primary { background: var(--accent); color: #2a1d00; border-color: #fff1c2; }
.screen .big:disabled { opacity: 0.4; cursor: default; }
#titleCv { image-rendering: pixelated; width: 264px; height: 96px; }

#roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
#roster button {
  background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 10px; color: var(--text);
  padding: 8px 4px 10px; cursor: pointer; position: relative; box-shadow: 0 3px 0 var(--shadow);
}
#roster button:active { transform: translateY(2px); }
#roster button.done { border-color: var(--accent-2); }
#roster button.done::after { content: '✔'; position: absolute; right: 6px; top: 4px; color: var(--accent-2); font-weight: 800; }
#roster canvas { image-rendering: pixelated; width: 48px; height: 48px; display: block; margin: 0 auto 4px; }
#roster b { display: block; font-size: 15px; }
#roster span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; word-break: keep-all; }

#menuList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
#goalBox {
  background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 8px; padding: 10px 12px;
  width: 100%; max-width: 300px; text-align: left; font-size: 14px; line-height: 1.5; word-break: keep-all;
}
#goalBox b { color: var(--accent); }

#credits { max-width: 360px; font-size: 15px; line-height: 1.7; color: var(--text); word-break: keep-all; }
#credits .names { color: var(--accent); font-weight: 700; font-size: 17px; }

@media (min-height: 760px) { #pad { height: 210px; } }
@media (max-height: 600px) { #pad { height: 150px; } #dpad { width: 132px; height: 132px; } #dpad .k { width: 44px; height: 44px; }
  #dpad .up,#dpad .mid,#dpad .down { left: 44px; } #dpad .down { top: 88px; } #dpad .left,#dpad .right,#dpad .mid { top: 44px; } #dpad .right { left: 88px; }
  #btns button { width: 58px; height: 58px; } #btns #btnB { width: 48px; height: 48px; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="176" height="208"></canvas>
    <div id="hud"><div class="who"><b id="hudName">—</b><span id="hudGoal"></span></div><button class="menu" id="btnBgm" aria-label="배경음악">🔊</button><button class="menu" id="btnMenu" aria-label="메뉴">☰</button></div>
    <div id="toast"></div>
    <div id="labels"></div>
    <canvas id="mini" width="24" height="18"></canvas>
    <div id="dlg"><div class="name" id="dlgName"></div><div class="text" id="dlgText"></div><div class="more" id="dlgMore">▼</div><div id="choices"></div></div>
    <div id="mg"><canvas id="mgCv" width="160" height="200"></canvas><div id="mgInfo"></div></div>
    <div id="fade"></div>
    <div id="photo"><img id="photoImg" alt="추억 사진"><div id="photoCap"></div></div>
  </div>
  <div id="pad">
    <div id="dpad">
      <div class="k up" data-d="up">▲</div><div class="k left" data-d="left">◀</div><div class="k mid"></div>
      <div class="k right" data-d="right">▶</div><div class="k down" data-d="down">▼</div>
    </div>
    <div id="btns">
      <button id="btnB">B<small>메뉴</small></button>
      <button id="btnA">A<small>말하기</small></button>
    </div>
  </div>

  <div class="screen show" id="scrTitle">
    <h1><small>부산 남산중학교</small>남산중<br>6인방</h1>
    <canvas id="titleCv" width="88" height="32"></canvas>
    <p>여섯 친구의 어느 하루.<br>한 명씩 번갈아 플레이해서 모두의 하루를 완성하세요.</p>
    <button class="big primary" id="btnNew">처음부터</button>
    <button class="big" id="btnContinue">이어하기</button>
    <p id="titleHint" style="font-size:12px">휴대폰 세로 화면에 맞춰져 있습니다. PC에서는 방향키 + Z(말하기) + X(메뉴)</p>
  </div>

  <div class="screen" id="scrSelect">
    <h1 style="font-size:26px">누구의 하루?</h1>
    <p>한 명을 고르면 그 친구가 되어 목표를 이룹니다.<br>다른 친구들은 학교 근처 어딘가에 있어요.</p>
    <div id="roster"></div>
    <button class="big primary" id="btnEnding" style="display:none">엔딩 보기 ★</button>
    <button class="big" id="btnToTitle">타이틀로</button>
  </div>

  <div class="screen" id="scrMenu">
    <h1 style="font-size:26px">메뉴</h1>
    <div id="goalBox"></div>
    <div id="menuList">
      <button class="big primary" id="btnResume">계속하기</button>
      <button class="big" id="btnSwitch">다른 친구로 바꾸기</button>
      <button class="big" id="btnRestartQuest">이 친구 처음부터</button>
    </div>
    <p style="font-size:12px">진행은 이 휴대폰(브라우저)에 자동 저장됩니다.</p>
  </div>

  <div class="screen" id="scrEnd">
    <h1 style="font-size:28px">그리고 지금</h1>
    <div id="credits"></div>
    <button class="big" id="btnEndClose">친구 선택으로</button>
  </div>
</div>
<script>
(function () {
'use strict';
/* ===== 남산중 6인방 — 모바일용 도트 RPG =====
   단일 파일. 그림은 전부 코드 안의 픽셀 배열·도형으로 그린다(외부 파일 없음).
   구조: store → 상수/캐릭터 → 스프라이트 → 타일 → 맵 → 엔진(입력·이동·그리기) → 대화 UI → 퀘스트 대본 → 화면 전환/부팅 */

// ----- 영속 저장: localStorage가 막힌 환경에서도 앱이 죽지 않게 감싼다 -----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 무시 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
};
const SAVE_KEY = 'namsan_save';

// ----- 선물하는 사람이 바꾸기 쉬운 것들 -----
// 엔딩 화면 마지막에 나오는 메시지. 줄바꿈은 \n
const FINAL_MESSAGE = '남산중학교에서 같이 보낸 날들,\n지금도 내 안에서 제일 환한 장면이야.\n앞으로도 오래오래, 우리.';
// 엔딩 크레딧에 찍히는 연도 느낌(원하면 수정)
const ERA = '200X년 어느 봄날';
// 엔딩 크레딧의 "만든 사람"
const MAKER = '오철우';

// ----- 상수 -----
const T = 16;            // 타일 한 변(px)
const VIEW_W = 11;       // 가로 타일 수(고정). 세로는 화면 높이에 맞춰 계산
const WALK_MS = 160;     // 한 칸 이동 시간
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ----- 여섯 친구 -----
// pal: 스프라이트 색 교체표. s 피부, h 머리, t 윗옷, p 바지, b 신발, a 포인트(깃·무늬)
const FRIENDS = [
  { id: 'cw', name: '오철우', tag: '축구와 체력의 남자',
    pal: { s: '#e6b48f', h: '#1c1c24', t: '#d94b4b', p: '#2f3f73', b: '#f4f4f4', a: '#ffffff' },
    quest: '운동장으로 굴러가 버린 축구공을 찾아 골을 넣자' },
  { id: 'yc', name: '정영채', tag: '요리·축구·공부, 다 조금씩',
    pal: { s: '#f1c7a3', h: '#4a2f24', t: '#5fb88a', p: '#5a4a3f', b: '#2b2b33', a: '#e8fff0' },
    quest: '급식실 특식 재료 세 가지를 모아 요리를 완성하자' },
  { id: 'si', name: '이상일', tag: '그림 그리는 사람',
    pal: { s: '#f1c7a3', h: '#6b4226', t: '#8b6bd1', p: '#3a3a4a', b: '#2b2b33', a: '#ffd166' },
    quest: '미술 숙제: 친구 다섯 명의 얼굴을 그려 오자' },
  { id: 'hs', name: '강현식', tag: '늑대의 황태자',
    pal: { s: '#f1c7a3', h: '#1f2433', t: '#3b5bd9', p: '#1e1e2a', b: '#2b2b33', a: '#ffd166' },
    quest: '싸이월드 인삿말을 오늘 안에 갱신하자' },
  { id: 'mn', name: '박민', tag: '우리 사이의 접착제',
    pal: { s: '#f1c7a3', h: '#3a2a20', t: '#e9c44c', p: '#4a5d8c', b: '#2b2b33', a: '#fff7d6' },
    quest: '흩어진 친구 다섯을 피자헛에 모으자' },
  { id: 'cg', name: '김창길', tag: '절약 정신과 경제 관념',
    pal: { s: '#f1c7a3', h: '#2a2a2a', t: '#8a8f9c', p: '#4c4340', b: '#2b2b33', a: '#c9a27a' },
    quest: '빈 병 다섯 개를 모아 최저가로 닭꼬치를 먹자' }
];
const F = {}; FRIENDS.forEach(f => { F[f.id] = f; });

// 동네 사람들 (같은 스프라이트, 색만 다름)
const NPC_PAL = {

// 도안 → 캔버스. 같은 도안을 색만 바꿔 여러 인물에 쓴다.
function drawPix(rows, pal, mirror) {
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x]; if (ch === '.') continue;
      let col = ch === 'k' || ch === 'e' ? OUTLINE : pal[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(mirror ? T - 1 - x : x, y, 1, 1);
    }
  }
  return c;
}
// 인물 하나의 프레임 묶음: frames[dir] = [서기, 걷기1, 서기, 걷기2]
function buildFrames(pal) {
  const mk = (k, m) => drawPix(SPR[k], pal, m);
  const d0 = mk('down0'), d1 = mk('down1'), d2 = mk('down1', true);
  const u0 = mk('up0'), u1 = mk('up1'), u2 = mk('up1', true);
  const l0 = mk('left0'), l1 = mk('left1');
  const r0 = mk('left0', true), r1 = mk('left1', true);
  return { down: [d0, d1, d0, d2], up: [u0, u1, u0, u2], left: [l0, l1, l0, l1], right: [r0, r1, r0, r1] };
}
const SPRITES = {};
FRIENDS.forEach(f => { SPRITES[f.id] = buildFrames(f.pal); });

// 맵 크기·바닥 캐시. 겹쳐 그리는 타일(over)의 바닥은 같은 줄에서 왼쪽으로 가장 가까운 '걸을 수 있는' 타일, 없으면 base
Object.keys(MAPS).forEach(id => {
  const m = MAPS[id]; m.id = id; m.h = m.rows.length; m.w = m.rows[0].length;
  m.rows.forEach((r, y) => { if (r.length !== m.w) console.error('맵 줄 길이 불일치', id, y, r.length, m.w); });
  m.baseRows = m.rows.map(r => {
    let out = '', last = m.base;
    for (let x = 0; x < r.length; x++) {
      const t = TILES[r[x]];
      if (t && !t.solid && !t.over) last = r[x];
      out += last;
    }
    return out;
  });
});

let held = null;                 // 지금 누르고 있는 방향
const keyDir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right' };
const keysDown = new Set();
function heldFromKeys() { for (const k of keysDown) if (keyDir[k]) return keyDir[k]; return null; }
window.addEventListener('keydown', e => {
  if (e.repeat) { if (keyDir[e.code]) e.preventDefault(); return; }
  if (keyDir[e.code]) { keysDown.add(e.code); held = keyDir[e.code]; e.preventDefault(); onDirPress(held); return; }
  if (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); pressA(); }
  else if (e.code === 'KeyX' || e.code === 'Escape') { e.preventDefault(); pressB(); }
});
window.addEventListener('keyup', e => { if (keyDir[e.code]) { keysDown.delete(e.code); held = heldFromKeys(); } });

// 가상 방향패드: 패드 영역 안에서 손가락 위치의 각도로 방향을 정한다(버튼 사이를 미끄러져도 됨)
const dpad = $('dpad');
function padDir(d) {
  held = d;
  dpad.querySelectorAll('.k').forEach(k => k.classList.toggle('on', !!d && k.dataset.d === d));
  if (d) onDirPress(d);
}
function dirFromPointer(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.12) return held; // 중앙 근처면 이전 방향 유지
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
let padPointer = null;
dpad.addEventListener('pointerdown', e => { padPointer = e.pointerId; dpad.setPointerCapture(e.pointerId); padDir(dirFromPointer(e)); e.preventDefault(); });
dpad.addEventListener('pointermove', e => { if (padPointer === e.pointerId) padDir(dirFromPointer(e)); });
const padEnd = e => { if (padPointer === e.pointerId) { padPointer = null; padDir(null); } };
dpad.addEventListener('pointerup', padEnd); dpad.addEventListener('pointercancel', padEnd);

function bindBtn(el, fn) {

// say(): 한 마디 보여주고 탭/Z를 기다림. ask(): 선택지. 둘 다 Promise라 대본을 순서대로 쓸 수 있다.
const dlg = $('dlg'), dlgName = $('dlgName'), dlgText = $('dlgText'), dlgMore = $('dlgMore'), choicesEl = $('choices');
let dlgState = null;   // { full, shown, timer, resolve, choices, sel }
function say(name, text) {
  return new Promise(resolve => {
    S.busy = true;
    dlg.classList.add('show'); choicesEl.classList.remove('show'); choicesEl.innerHTML = '';
    dlgName.textContent = name || ''; dlgName.style.display = name ? '' : 'none';
    dlgMore.classList.add('hide');
    dlgState = { full: text, shown: 0, resolve, choices: null };
    dlgText.textContent = '';
    const tick = () => {
      if (!dlgState || dlgState.full !== text) return;
      dlgState.shown = Math.min(text.length, dlgState.shown + 1);
      dlgText.textContent = text.slice(0, dlgState.shown);
      if (dlgState.shown < text.length) dlgState.timer = setTimeout(tick, 22);
      else dlgMore.classList.remove('hide');
    };
    tick();
  });
}
function ask(name, text, options) {
  return new Promise(async resolve => {
    await say(name, text);
    // say가 끝난 직후 선택지를 붙인다
    S.busy = true;
    dlg.classList.add('show'); dlgMore.classList.add('hide');
    dlgName.textContent = name || ''; dlgText.textContent = text;
    dlgState = { full: text, shown: text.length, resolve, choices: options, sel: 0 };
    choicesEl.innerHTML = ''; choicesEl.classList.add('show');
    options.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o; b.type = 'button';
      if (i === 0) b.classList.add('sel');
      b.addEventListener('click', e => { e.stopPropagation(); finishChoice(i); });
      choicesEl.appendChild(b);
    });
  });
}
function finishChoice(i) {
  const st = dlgState; if (!st || !st.choices) return;
  dlgState = null; closeDlg(); st.resolve(i);
}
function closeDlg() { dlg.classList.remove('show'); choicesEl.classList.remove('show'); choicesEl.innerHTML = ''; S.busy = false; }
// 대화 진행(탭/Z). 글자가 나오는 중이면 전부 보여주고, 다 나왔으면 다음으로.
function advanceDlg() {
  const st = dlgState; if (!st) return false;
  if (st.choices) { finishChoice(st.sel); return true; }
  if (st.shown < st.full.length) { clearTimeout(st.timer); st.shown = st.full.length; dlgText.textContent = st.full; dlgMore.classList.remove('hide'); return true; }
  dlgState = null; closeDlg(); st.resolve();
  return true;
}
// 글 영역을 탭하면 다음으로. 선택지가 떠 있을 땐 글 탭으로 고르지 않는다(실수 방지) — 버튼이나 A로만
dlg.addEventListener('pointerdown', e => { if (e.target.closest('#choices')) return; e.preventDefault(); if (dlgState && dlgState.choices) return; advanceDlg(); });
function moveChoice(d) {
  const st = dlgState; if (!st || !st.choices) return false;
  st.sel = (st.sel + d + st.choices.length) % st.choices.length;
  choicesEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sel', i === st.sel));
  return true;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('show');
  void t.offsetWidth; t.classList.add('show');
}
async function fade(on) { $('fade').classList.toggle('on', on); await sleep(260); }

let quest = null;  // 지금 플레이 중인 친구의 대본(QUESTS[id])
const tileAt = (m, x, y) => (x < 0 || y < 0 || x >= m.w || y >= m.h) ? null : m.rows[y][x];
function isSolidTile(m, x, y) { const ch = tileAt(m, x, y); if (ch === null) return true; const t = TILES[ch]; return !t || !!t.solid; }
function entAt(x, y) { return S.ents.find(e => !e.gone && e.x === x && e.y === y); }
function exitAt(x, y) { return S.map.exits.find(e => e.edge === 'bottom' ? y === S.map.h - 1 : (e.x === x && e.y === y)); }
function findEnt(id) { return S.ents.find(e => e.id === id && !e.gone); }

// 맵에 들어갈 때 그 맵의 사람·친구·아이템을 놓는다
function buildEnts() {
  const id = S.map.id; S.ents = [];
  (NPCS[id] || []).forEach(n => {
    if (quest && quest.hideNpc && quest.hideNpc(n.id)) return;
    const ov = quest && quest.npcPos && quest.npcPos(n.id);
    S.ents.push(Object.assign({ kind: 'npc' }, n, ov || {}));
  });
  FRIENDS.forEach(f => {
    if (f.id === S.hero) return;
    const pos = (quest && quest.friendPos && quest.friendPos(f.id)) || HOME[f.id];
    if (pos && pos.map === id) S.ents.push({ kind: 'friend', id: f.id, spr: f.id, name: f.name, x: pos.x, y: pos.y, dir: pos.dir || 'down' });
  });
  if (quest && quest.ents) quest.ents(id).forEach(e => S.ents.push(e));
  if (quest && quest.marks) quest.marks();
}
// 바닥에 놓인 아이템 하나 만들기. 밟으면 onPick
function item(id, icon, x, y, onPick) { return { kind: 'item', id, icon, x, y, solid: false, onPick, mark: true }; }

// ----- 이동 -----
function startMove(nx, ny, after) { S.moving = { fx: S.px, fy: S.py, t0: S.time, after }; S.px = nx; S.py = ny; }
function tryMove(d) {
  S.dir = d;
  const [dx, dy] = DIRS[d], nx = S.px + dx, ny = S.py + dy;
  const e = entAt(nx, ny);
  if (e && e.kind === 'ball') {               // 공 차기: 공이 한 칸 굴러가고 나도 그 자리로
    const bx = nx + dx, by = ny + dy;
    if (isSolidTile(S.map, bx, by) || entAt(bx, by)) return false;
    e.moving = { fx: e.x, fy: e.y, t0: S.time }; e.x = bx; e.y = by;
    startMove(nx, ny, async () => { if (tileAt(S.map, e.x, e.y) === 'n' && quest && quest.onGoal) { S.lock = true; await quest.onGoal(e); S.lock = false; } });
    return true;
  }
  if (isSolidTile(S.map, nx, ny)) return false;
  if (e && e.solid !== false) return false;
  startMove(nx, ny);
  return true;
}
async function arrive() {
  const x = S.px, y = S.py;
  const it = entAt(x, y);
  if (it && it.kind === 'item') { it.gone = true; if (it.onPick) await it.onPick(it); }
  const ex = exitAt(x, y);
  if (S.onExit) { if (!ex) S.onExit = false; }
  else if (ex) { goMap(ex.to, ex.tx, ex.ty, ex.dir); return; }
  if (quest && quest.onStep) quest.onStep(S.map.id, x, y);
}
async function goMap(id, x, y, dir, silent) {
  S.busy = true;
  await fade(true);
  S.map = MAPS[id]; S.px = x; S.py = y; if (dir) S.dir = dir; S.moving = null;
  buildEnts(); S.onExit = !!exitAt(x, y);
  draw();
  await fade(false);
  S.busy = false;
  if (!silent) toast(S.map.name);
  if (quest && quest.onEnter) { S.lock = true; await quest.onEnter(id); S.lock = false; }
  save();
}
// NPC를 한 칸씩 걸어가게 한다(대본용). 막히면 그냥 순간이동
async function walkEnt(e, path) {
  e.walk = true;
  for (const d of path) {
    const [dx, dy] = DIRS[d]; e.dir = d;
    e.moving = { fx: e.x, fy: e.y, t0: S.time }; e.x += dx; e.y += dy;
    await sleep(WALK_MS);
  }
  e.walk = false;
}

function pressA() {
  if (MG.active) { if (MG.tap) MG.tap(); return; }
  if (S.screen !== 'game') return;
  if (dlgState) { advanceDlg(); return; }
  if (S.busy || S.lock || S.moving) return;

function pressB() {

async function interact() {
  const [dx, dy] = DIRS[S.dir], fx = S.px + dx, fy = S.py + dy;
  let e = entAt(fx, fy);
  const ch = tileAt(S.map, fx, fy), t = TILES[ch];
  if (!e && t && t.solid && t.over) { const e2 = entAt(fx + dx, fy + dy); if (e2 && (e2.kind === 'npc' || e2.kind === 'friend')) e = e2; } // 계산대 너머 사람
  if (e && (e.kind === 'npc' || e.kind === 'friend')) { await talkTo(e); return; }
  if (e && e.kind === 'item') { e.gone = true; if (e.onPick) await e.onPick(e); return; }

  if (GENERIC_LOOK[ch]) await say('', GENERIC_LOOK[ch]);
}
async function talkTo(e) {
  e.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[S.dir];
  let fn = null;
  if (e.kind === 'friend') fn = quest && quest.friendTalk && quest.friendTalk[e.id];
  else fn = quest && quest.npcTalk && quest.npcTalk[e.id];
  if (fn) await fn(e); else await defaultTalk(e);
  if (quest && quest.marks) quest.marks();
  setHud(); save();
}
async function defaultTalk(e) {
  const lines = e.kind === 'friend' ? FRIEND_LINES[e.id] : NPC_LINES[e.id];
  const arr = Array.isArray(lines) ? lines : [lines || '...'];

// ----- 그리기 -----
function drawChar(spr, dir, frame, x, y) { const fr = SPRITES[spr]; if (fr) ctx.drawImage(fr[dir] ? fr[dir][frame] : fr.down[0], Math.round(x), Math.round(y)); }
function draw() {
  if (!S.map) return;
  const m = S.map, now = S.time;
  let ppx = S.px, ppy = S.py;
  if (S.moving) { const k = Math.min(1, (now - S.moving.t0) / WALK_MS); ppx = S.moving.fx + (S.px - S.moving.fx) * k; ppy = S.moving.fy + (S.py - S.moving.fy) * k; }
  const focus = S.focus || { x: ppx, y: ppy };
  let camX = focus.x * T + T / 2 - cv.width / 2, camY = focus.y * T + T / 2 - cv.height / 2;
  const maxX = m.w * T - cv.width, maxY = m.h * T - cv.height;
  camX = Math.round(maxX < 0 ? maxX / 2 : Math.max(0, Math.min(maxX, camX)));
  camY = Math.round(maxY < 0 ? maxY / 2 : Math.max(0, Math.min(maxY, camY)));
  ctx.fillStyle = '#0e0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
  const x0 = Math.floor(camX / T), y0 = Math.floor(camY / T);
  for (let y = y0; y <= y0 + VIEW_H; y++) for (let x = x0; x <= x0 + VIEW_W; x++) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
    const ch = m.rows[y][x], t = TILES[ch], sx = x * T - camX, sy = y * T - camY;
    if (t && t.over) ctx.drawImage(ATLAS[m.baseRows[y][x]], sx, sy);
    const img = ATLAS[ch]; if (img) ctx.drawImage(img, sx, sy);
  }
  const list = S.ents.filter(e => !e.gone).map(e => ({ e, y: e.y }));
  if (!S.hideHero) list.push({ player: true, y: ppy });
  list.sort((a, b) => a.y - b.y);
  const bob = Math.round(Math.sin(now / 220)) ;
  for (const it of list) {
    if (it.player) { drawChar(S.hero, S.dir, S.moving ? [1, 3][S.step % 2] : 0, ppx * T - camX, ppy * T - camY); continue; }
    const e = it.e; let ex = e.x, ey = e.y;
    if (e.moving) { const k = Math.min(1, (now - e.moving.t0) / WALK_MS); if (k >= 1) e.moving = null; else { ex = e.moving.fx + (e.x - e.moving.fx) * k; ey = e.moving.fy + (e.y - e.moving.fy) * k; } }
    const sx = Math.round(ex * T - camX), sy = Math.round(ey * T - camY);
    if (e.kind === 'item') ctx.drawImage(ICONS[e.icon] || ICONS.paper, sx, sy + bob);
    else if (e.kind === 'ball') ctx.drawImage(ICONS.ball, sx, sy);
    else drawChar(e.spr, e.dir || 'down', e.walk ? [1, 3][Math.floor(now / WALK_MS) % 2] : 0, sx, sy);
    if (e.mark && e.kind !== 'item') ctx.drawImage(ICONS.mark, sx, sy - 12 + bob);
  }
  if (S.tint) { ctx.fillStyle = S.tint; ctx.fillRect(0, 0, cv.width, cv.height); }
  updateLabels(camX, camY); drawMini();
}
function update(now) {
  S.time = now;
  if (S.moving && now - S.moving.t0 >= WALK_MS) { const mv = S.moving; S.moving = null; S.step = (S.step + 1) % 4; if (mv.after) mv.after(); arrive(); }
  if (!S.moving && !S.busy && !S.lock && S.screen === 'game' && held) tryMove(held);
}
function loop(now) { update(now); if (S.screen === 'game' || S.screen === 'menu') draw(); requestAnimationFrame(loop); }

// ----- 건물 이름표: 캔버스 위 DOM 레이어 (저해상도 도트 위에서도 글자가 또렷) -----
let labelMapId = null;
function syncLabelsBox() {
  const st = $('stage').getBoundingClientRect(), cb = cv.getBoundingClientRect();
  const el = $('labels');
  el.style.left = (cb.left - st.left) + 'px'; el.style.top = (cb.top - st.top) + 'px';
  el.style.width = cb.width + 'px'; el.style.height = cb.height + 'px';
}
function updateLabels(camX, camY) {
  const box = $('labels');
  if (labelMapId !== S.map.id) {
    labelMapId = S.map.id; box.innerHTML = '';
    (S.map.labels || []).forEach(l => {
      const d = document.createElement('div');
      d.className = 'lb' + (l.exit ? ' exit' : ''); d.textContent = l.t; d._l = l;
      box.appendChild(d);
    });
  }
  const W = cv.width * SCALE, H = cv.height * SCALE;
  for (const d of box.children) {
    const l = d._l;
    const x = (l.x * T + T / 2 - camX) * SCALE, y = (l.y * T - camY) * SCALE;
    if (x < -70 || y < -8 || x > W + 70 || y > H + 30) { d.style.display = 'none'; continue; }
    d.style.display = ''; d.style.left = x + 'px'; d.style.top = Math.max(15, y) + 'px';
  }
}

// ----- 미니맵: 지금 맵의 윤곽 + 출구(노랑) + 사람(초록=친구) + 나(흰 점멸) -----
const miniCv = $('mini'), miniCtx = miniCv.getContext('2d');
const miniBase = {};
function drawMini() {
  const m = S.map; if (!m) return;
  const sc = m.w > 26 ? 2 : 3, key = m.id + ':' + sc;
  if (!miniBase[key]) {
    const c = document.createElement('canvas'); c.width = m.w * sc; c.height = m.h * sc;
    const g = c.getContext('2d');
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const ch = m.rows[y][x], t = TILES[ch];
      g.fillStyle = (ch === 'D' || ch === 'Q') ? '#ffd166' : (!t || t.solid) ? '#34325a' : '#7d79aa';
      g.fillRect(x * sc, y * sc, sc, sc);
    }
    m.exits.forEach(e => { g.fillStyle = '#ffd166'; if (e.edge === 'bottom') g.fillRect(0, (m.h - 1) * sc, m.w * sc, sc); else g.fillRect(e.x * sc, e.y * sc, sc, sc); });
    miniBase[key] = c;
  }
  const base = miniBase[key];
  if (miniCv.width !== base.width || miniCv.height !== base.height) { miniCv.width = base.width; miniCv.height = base.height; }
  miniCv.style.width = Math.round(base.width * 1.4) + 'px';
  miniCtx.drawImage(base, 0, 0);
  for (const e of S.ents) {
    if (e.gone || (e.kind !== 'npc' && e.kind !== 'friend')) continue;
    miniCtx.fillStyle = e.kind === 'friend' ? '#7bd389' : '#cfcbe8';
    miniCtx.fillRect(e.x * sc, e.y * sc, sc, sc);
  }
  if (Math.floor(S.time / 280) % 2 === 0) { miniCtx.fillStyle = '#ffffff'; miniCtx.fillRect(S.px * sc, S.py * sc, sc, sc); }
}

// ----- 추억 사진 연출: photos/<이름>.jpg 를 ms 동안 보여준다. 파일이 없으면 설명 카드로 대신 -----
async function showPhoto(keys, caption, ms) {
  if (typeof keys === 'string') keys = [keys];
  const ph = $('photo'), img = $('photoImg'), cap = $('photoCap');
  let ok = false;
  outer: for (const k of keys) for (const ext of ['jpg', 'png', 'jpeg', 'webp']) {
    ok = await new Promise(res => {
      const im = new Image(); const t = setTimeout(() => res(false), 2500);
      im.onload = () => { clearTimeout(t); img.src = im.src; res(true); };
      im.onerror = () => { clearTimeout(t); res(false); };
      im.src = 'photos/' + k + '.' + ext;
    });
    if (ok) break outer;
  }
  img.style.display = ok ? '' : 'none';
  cap.textContent = caption + (ok ? '' : '\n(namsan-rpg/photos/' + keys[0] + '.jpg 파일을 넣으면 실제 사진이 나옵니다)');
  ph.classList.add('on'); void ph.offsetWidth; ph.classList.add('show');
  await sleep(ms);
  ph.classList.remove('show'); await sleep(380); ph.classList.remove('on');
}

// ----- 미니게임: 샐러드 쌓기 (좌우로 오가는 재료를 탭으로 얹기, target단이면 성공) -----
const MG = { active: false, tap: null, cancel: null };
function playStack(target) {
  return new Promise(resolve => {
    const cvm = $('mgCv'), g = cvm.getContext('2d');
    const w = Math.min(300, Math.floor(window.innerWidth * 0.78));
    cvm.style.width = w + 'px'; cvm.style.height = Math.round(w * 200 / 160) + 'px';
    const FOODS = [['상추', '#7bd389'], ['토마토', '#ef6f6c'], ['옥수수', '#ffd166'], ['마카로니', '#f2c9a0'], ['단무지', '#ffe08a'], ['미니피자', '#e08a4e'], ['젤리', '#c9a2e0'], ['파인애플', '#ffe066']];
    let stack, cur, over, win;
    const reset = () => { stack = [{ x: 80, w: 60, food: -1 }]; cur = { x: 20, w: 46, dir: 1, sp: 1.4, food: 0 }; over = false; win = false; };
    reset();
    MG.active = true; $('mg').classList.add('show');
    const finish = val => { MG.active = false; MG.tap = MG.cancel = null; clearInterval(timer); $('mg').classList.remove('show'); resolve(val); };
    MG.cancel = () => finish(false);
    MG.dbg = () => ({ cx: cur.x, tx: stack[stack.length - 1].x, n: stack.length - 1, over, win });
    MG.forceWin = () => finish(true);
    MG.tap = () => {
      if (over) { if (win) finish(true); else reset(); return; }
      const top = stack[stack.length - 1];
      if (Math.abs(cur.x - top.x) > (top.w + cur.w) / 2 - 8) { over = true; win = false; return; }
      stack.push({ x: cur.x, w: cur.w, food: cur.food });
      if (stack.length - 1 >= target) { over = true; win = true; return; }
      cur = { x: cur.dir > 0 ? 16 : 144, w: Math.max(28, cur.w - 1), dir: -cur.dir, sp: 1.4 + stack.length * 0.16, food: (cur.food + 1) % FOODS.length };
    };
    const timer = setInterval(() => {
      if (!over) { cur.x += cur.dir * cur.sp; if (cur.x < 16) { cur.x = 16; cur.dir = 1; } if (cur.x > 144) { cur.x = 144; cur.dir = -1; } }
      g.fillStyle = '#17162c'; g.fillRect(0, 0, 160, 200);
      const n = stack.length - 1, lift = Math.max(0, (n + 1) * 12 - 130);
      g.fillStyle = '#f4f4f4'; g.fillRect(stack[0].x - 30, 176 + lift, 60, 8);
      g.fillStyle = '#c9c9d2'; g.fillRect(stack[0].x - 24, 184 + lift, 48, 3);
      for (let i = 1; i < stack.length; i++) {
        const it = stack[i];
        g.fillStyle = FOODS[it.food][1]; g.fillRect(it.x - it.w / 2, 176 - i * 12 + lift, it.w, 11);
        g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(it.x - it.w / 2, 176 - i * 12 + 9 + lift, it.w, 2);
      }
      if (!over) {
        const y = 176 - (n + 1) * 12 + lift - 8;
        g.fillStyle = FOODS[cur.food][1]; g.fillRect(cur.x - cur.w / 2, y, cur.w, 11);
        g.strokeStyle = '#ffffff'; g.strokeRect(cur.x - cur.w / 2 + 0.5, y + 0.5, cur.w - 1, 10);
      }
      $('mgInfo').textContent = over
        ? (win ? '샐러드 탑 ' + n + '단 완성!\n탭(Z)해서 계속' : '와르르! 무너졌다…\n탭(Z) 다시 · B(X) 그만두기')
        : '샐러드 ' + n + '/' + target + '단 — ' + FOODS[cur.food][0] + '\n탭(또는 Z)으로 얹기 · B(X) 그만';
    }, 16);
  });
}
$('mg').addEventListener('pointerdown', e => { e.preventDefault(); if (MG.tap) MG.tap(); });

function setHud() {

async function startHero(id, fresh) {

  si: { map: 'pizza', x: 5, y: 4, dir: 'right' }, hs: { map: 'pizza', x: 8, y: 4, dir: 'left' },
  cg: { map: 'pizza', x: 4, y: 6, dir: 'up' }, mn: { map: 'pizza', x: 5, y: 6, dir: 'up' }
};

// ===== 퀘스트 대본 =====
const QUESTS = {};

// --- 오철우: 영채의 부탁으로 공 찾기 → 골 → 은하탕 (그날의 목격담) ---
QUESTS.cw = {
  start: { map: 'field', x: 10, y: 10, dir: 'up' },
  init(q) { q.stage = 0; },
  goal(q) { return q.stage < 2 ? '언덕 아래 동네로 굴러간 공 찾기 (영채의 부탁)' : q.stage === 2 ? '운동장 골망에 공 넣기 (공 뒤에서 밀기)' : '동네 은하탕에서 영채 만나기'; },
  hint(q) { return q.stage < 2 ? '언덕을 내려가 학교 앞 동네로. 삼창슈퍼 앞 도로를 잘 보자.' : q.stage === 2 ? '공 뒤에 서서 골망 쪽으로 밀면 굴러간다. 골망은 운동장 양쪽 끝. 공이 구석에 끼면 축구부 1학년에게 부탁.' : '동네 아래쪽 줄, 벽화 있는 건물이 은하탕이다.'; },
  async intro() {
    await say('정영채', '철우야, 아까 슛 연습하다 공이 언덕 아래 동네까지 굴러갔어.');
    await say('정영채', '체력 하나는 니가 전교 1등이잖아. 좀 찾아와 줘라. 끝나고 한 판 하자.');
    await say('오철우', '언덕 왕복? 껌이지. 갔다 올게.');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { markEnts([]); },
  friendPos(fid) {
    if (fid !== 'yc') return null;
    return S.q.stage < 3 ? { map: 'field', x: 10, y: 9, dir: 'down' } : { map: 'bath', x: 3, y: 2, dir: 'down' };
  },
  ents(mapId) {
    const q = S.q, out = [];
    if (q.stage === 1 && mapId === 'town') out.push(item('ball', 'ball', 7, 5, async () => {
      await say('오철우', '찾았다! 삼창슈퍼 앞까지 굴러왔네. 아이스크림 하나 먹고 싶다…');
      q.stage = 2; got('축구공 획득');
    }));
    if (q.stage === 2 && mapId === 'field') out.push({ kind: 'ball', id: 'ball', x: 11, y: 11, mark: true });
    return out;
  },
  friendTalk: {
    yc: async e => {
      const q = S.q;
      if (q.stage < 2) await say(e.name, '삼창슈퍼 쪽으로 굴러가는 거 봤어. 부탁해!');
      else if (q.stage === 2) await say(e.name, '가운데 공! 골망에 밀어 넣으면 인정.');
      else await say(e.name, '은하탕에서 보자. 먼저 가 있을게.');
    }
  },
  npcTalk: {
    soccerA: async e => {
      const q = S.q;
      if (q.stage === 2) {
        const i = await ask(e.name, '형, 골 넣어요! 공이 구석에 끼었으면 제가 다시 갖다 놓을게요.', ['괜찮아, 내가 할게', '공 다시 갖다 놔 줘']);
        if (i === 1) { const b = findEnt('ball'); if (b) { b.x = 11; b.y = 11; b.moving = null; } await say(e.name, '여기요! 가운데 놨어요.'); }
      } else await defaultTalk(e);
    },
    soccerB: async e => { await say(e.name, S.q.stage === 2 ? '오른쪽 골대로 밀어! 아니 왼쪽도 돼!' : '철우 형 체력이면 언덕 열 번도 왕복하지.'); }
  },
  async onGoal(ball) {
    ball.gone = true;
    await say('', '골───────!');
    await say('정영채', '역시 오철우. 자, 약속대로 한 판 뛰고… 씻으러 가자. 은하탕.');
    await say('오철우', '콜. 바나나우유는 진 사람이 사기다.');
    const e = findEnt('yc');
    if (e) { await walkEnt(e, ['down', 'down', 'down']); e.gone = true; }
    S.q.stage = 3; setHud(); save();
    await say('', '(한 판 신나게 뛰었다. 둘 다 땀범벅이 됐다)');
  },
  async onEnter(mapId) {
    const q = S.q; if (mapId !== 'bath' || q.stage !== 3 || q.finished) return;
    await showPhoto('bath', '은하탕 — 축구 끝나면 늘 여기였다', 3000);
    await say('', '은하탕 탈의실. 뜨끈한 김이 문틈으로 새어 나온다.');
    await say('정영채', '아~ 오늘 골 좋았다. 빨리 씻고 바나나우유 내기 가위바위보 하자.');
    await say('', '영채가 아무렇지 않게 옷을 벗는다. 철우는 무심코 고개를 돌렸다가…');
    await say('오철우', '…!!!');
    await say('', '(철우는 영채의 거대한 거시기를 보고 말았다)');
    await say('정영채', '왜? 뭐 묻었어?');
    await say('오철우', '…아니. 아무것도. (저게… 사람인가?)');
    await say('', '그날 이후 철우는 영채를 볼 때마다 알 수 없는 존경심을 느꼈다고 한다.');
    await finishQuest();
  }
};

// --- 정영채: 상일이 소개해 준 남궁진… 기회를 봐서 잘 빠져나오기 ---
QUESTS.yc = {
  start: { map: 'school', x: 12, y: 7, dir: 'right' },
  init(q) { q.stage = 0; q.fails = 0; },
  goal(q) { return q.stage < 1 ? '상일이 이야기 듣기' : '피자헛에서 남궁진 만나기… 그리고 눈치껏 빠져나오기'; },
  hint() { return '피자헛은 학교 앞 동네 아래쪽 줄. 대화 선택지를 잘 고르면 기분 안 상하게 빠져나올 수 있다. 실패해도 다시 말 걸면 된다.'; },
  async intro() {
    await say('이상일', '영채야. 초상화 그려 준 보답, 기억하지? 여자 소개해 주기로 한 거.');
    await say('정영채', '아, 그… 진짜 하는 거였어?');
    await say('이상일', '이름은 남궁진. 지금 피자헛에서 기다려. 성격은… 확실해.');
    await say('정영채', '성격"은"? 야, 이상일. 성격"은"이 무슨 뜻이야. 야!');
    await say('이상일', '(이미 미술실 쪽으로 사라졌다)');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { markEnts([]); },
  friendPos(fid) { return fid === 'si' ? { map: 'school', x: 13, y: 7, dir: 'left' } : null; },
  ents(mapId) {
    if (mapId !== 'pizza' || S.q.finished) return [];
    return [{ kind: 'npc', id: 'jin', spr: 'jin', name: '남궁진', x: 4, y: 4, dir: 'down', mark: true }];
  },
  async blindDate() {
    const q = S.q;
    let tact = 0;
    await say('남궁진', '네가 정영채구나!! 상일이한테 얘기 많~이 들었어. 앉아 앉아!');
    await say('정영채', '(상일아, 네 심미안에 대해 얘기 좀 하자.)');
    await say('정영채', '(침착하자. 기분 안 상하게, 자연스럽게 빠져나가는 거다.)');
    let i = await ask('남궁진', '피자 뭐 먹을래? 난 다 좋아. 너도 다 좋아하게 생겼어.', ['아… 나 급식 먹고 와서 배부르네', '다 좋아 (아무거나)', '상일이는 뭐 좋아한대?']);
    if (i === 0) { tact++; await say('남궁진', '헐 급식을 다 먹었어? 그래도 라지 시키자!'); }
    else if (i === 1) { await say('남궁진', '역시! 우리 잘 맞는다. 라지에 사이드 추가!'); }
    else { await say('남궁진', '상일이 얘기는 왜 해~ 지금은 우리 얘기 하자.'); }
    i = await ask('남궁진', '우리 사진 찍자! 내 싸이월드에 올리게. 제목은 "운명"?', ['나 사진 진짜 못 받아서… 다음에', '그, 그래…', '제목은 좀 바꾸면 안 될까']);
    if (i === 0) { tact++; await say('남궁진', '괜찮아, 내가 보정 잘해. …그래도 다음에 찍자.'); }
    else if (i === 1) { await say('남궁진', '찰칵! 도토리로 스킨도 "커플" 테마로 바꿔야지~'); }
    else { tact += 0; await say('남궁진', '"운명2"는 어때?'); }
    i = await ask('남궁진', '끝나고 만화방 갈래? 내가 300원 쏠게.', ['오늘 급식실 정리 당번이라…', '좋아', '만화 안 좋아해']);
    if (i === 0) { tact++; await say('남궁진', '성실하다… 더 마음에 들어…'); await say('정영채', '(역효과다?!)'); }
    else if (i === 1) { await say('남궁진', '좋아!! 순정만화 코너부터 가자!'); }
    else { await say('남궁진', '그럼 뭐 좋아해? 다 맞춰 줄게.'); }
    await say('', '(그때, 주방 쪽에서 접시 부딪히는 소리가 났다. 지금이다.)');
    i = await ask('정영채', '(빠져나갈 기회다. 어떻게 하지?)', ['"사장님이 나 부르시는 것 같은데?! 미안, 급식실 당번도 있어서!"', '화장실 간다고 하고 그대로 집에 간다', '그냥 계속 앉아 있는다']);
    if (i === 0) tact++;
    else if (i === 1) { await say('남궁진', '어? 화장실 저쪽인데? …야! 가방 두고 가!'); }
    else { await say('정영채', '(주저앉았다. 오늘 안에 못 나간다…)'); }
    if (tact >= 3) {
      await say('남궁진', '어쩔 수 없네~ 성실한 남자. 다음에 또 보자!');
      await say('정영채', '(웃으면서, 정중하게, 그러나 빛의 속도로) 그래! 잘 지내!');
      await say('', '영채는 문을 나서서 세 블록을 전력 질주했다.');
      await say('정영채', '휴… 기분 안 상하게 잘 나왔다. 근데 이상일… 각오해라.');
      await finishQuest();
      return true;
    }
    q.fails++;
    await say('남궁진', '오늘 진짜 재밌다! 우리 내일도 만날까? 모레도?');
    await say('정영채', '(망했다. 다시 기회를 노리자…)');
    await say('', '(남궁진에게 다시 말을 걸면 기회가 온다. 부드러운 대답을 고르자.)');
    return false;
  },
  npcTalk: {
    jin: async () => { await QUESTS.yc.blindDate(); },
    pizzaStaff: async e => { await say(e.name, '저 학생, 아까부터 계속 얘기 중이네… 주문은 언제 하려나.'); }
  },
  friendTalk: {
    si: async e => {
      if (S.q.stage < 1) { await defaultTalk(e); return; }
      await say(e.name, '벌써 만났어? 남궁진 괜찮지? 목소리도 크고… 존재감 있고…');
      await say('정영채', '이상일. 보답이 왜 벌칙이 됐는지 설명해 봐.');
    }
  },
  async onEnter(mapId) {
    if (mapId !== 'pizza' || S.q.stage !== 1 || S.q.finished || S.q.met) return;
    S.q.met = true; save();
    await say('', '피자헛. 창가 자리에서 누군가 힘차게 손을 흔든다.');
    await QUESTS.yc.blindDate();
  }
};

// --- 이상일: 정영채 초상화 그리기 (보답은… 여자 소개) ---
QUESTS.si = {
  start: { map: 'house', x: 2, y: 5, dir: 'up' },
  init(q) { q.stage = 0; q.drawn = false; },
  goal(q) { return q.stage < 1 ? '미술 숙제 확인하기' : !q.drawn ? '급식실의 영채를 찾아가 그리기' : '집 책상에서 그림 마무리하기'; },
  hint(q) { return !q.drawn ? '영채는 급식실에 있다. 학교 복도 오른쪽 끝 문.' : '집 책상(왼쪽 위) 앞에 서서 A.'; },
  async intro() {
    await say('이상일', '미술 숙제: 인물화 한 장. 내일까지.');
    await say('이상일', '…영채를 그리자. 요리하는 사람 얼굴이 제일 살아 있거든.');
    await say('이상일', '공짜로 그려 달라긴 미안하니까, 보답도 준비했다. 후후.');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { const q = S.q; markEnts(!q.drawn ? ['yc'] : []); },
  friendTalk: {
    yc: async e => {
      const q = S.q;
      if (q.drawn) { await say(e.name, '다 그렸으면 집에 가서 마무리해야지. 잘 부탁한다?'); return; }
      await say('이상일', '영채야, 너 그릴게. 5분만 그대로 있어 봐.');
      await say('정영채', '나 지금 양파 까서 눈물 나는데. 이 얼굴로 괜찮아?');
      const i = await ask('이상일', '어떤 모습으로 그릴까?', ['국자 든 옆모습 (요리사 영채)', '눈물 그렁그렁 정면 (사실주의)', '공 밟은 포즈 (축구인 영채)']);
      await say('', ['(슥슥) 국자 끝까지 진지하다. 좋다.', '(슥슥) 양파 눈물까지 담았다. 이것이 사실주의.', '(슥슥) 급식실에서 축구 포즈라니. 그래도 좋다.'][i]);
      await say('이상일', '다 됐다. 역시 영채야. 보답으로… 여자 소개해 줄게.');
      await say('정영채', '뭐? 갑자기? 누구?');
      await say('이상일', '남궁진이라고… 성격이 확실한 애야. 기대해라.');
      await say('정영채', '(왠지 모를 불안감이 스쳤다)');
      q.drawn = true; got('영채 스케치 완료'); QUESTS.si.marks();
      await say('이상일', '집에 가서 책상에서 마무리하자.');
    }
  },
  npcTalk: {
    teacher: async e => { await say(e.name, '상일이, 인물화 숙제 잊지 마라. 정성 들여서.'); },
    lunchLady: async e => { await say(e.name, '그림 그린다고 급식실에서 얼쩡거리면 못 쓴다. …잘 그리긴 하네.'); }
  },
  interact(mapId, x, y, ch) {
    if (mapId !== 'house' || ch !== 'd') return null;
    return async () => {
      const q = S.q;
      if (!q.drawn) { await say('이상일', '아직 스케치를 못 했다. 급식실의 영채부터.'); return; }
      await say('', '책상에 앉아 연필 선을 정리하고, 색을 얹었다.');
      const i = await ask('이상일', '그림 제목은?', ['「요리하는 사람, 정영채」', '「양파와 눈물」', '「남산중의 만능」']);
      await say('이상일', '제목은 ' + ['「요리하는 사람, 정영채」', '「양파와 눈물」', '「남산중의 만능」'][i] + '. 나쁘지 않다.');
      await say('이상일', '이 정도면 숙제가 아니라 작품이지. 영채한테 보답할 준비도 됐고.');
      await showPhoto('comics', '만화방 — 그림을 완성한 날엔 늘 여기 들러 신간을 봤다', 3000);
      await finishQuest();
    };
  }
};

// --- 강현식: 철우·상일과 함께 영채에게 스타크래프트 3:1 도전 ---
QUESTS.hs = {
  start: { map: 'field', x: 12, y: 9, dir: 'left' },
  init(q) { q.stage = 0; q.wins = 0; },
  goal(q) { return q.stage < 1 ? '박민 이야기 듣기' : '피씨방에서 철우·상일과 함께 영채에게 3:1 스타 도전 (컴퓨터 앞에서 A)'; },
  hint() { return '피씨방은 동네 오른쪽 끝. 병력을 3까지 모으면 필살기 「늑대의 포효」가 열린다. 영채가 움직이는 낌새면 수비!'; },
  async intro() {
    await say('박민', '현식아. 영채가 그러는데… 스타는 3:1로 붙어도 자기가 이긴대.');
    await say('강현식', '…뭐?');
    await say('박민', '철우랑 상일이는 벌써 피씨방 가 있어. 영채도. 다들 너만 기다려.');
    await say('강현식', '늑대의 황태자를 건드렸군. 간다.');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { markEnts([]); },
  friendPos(fid) {
    const pos = { cw: { map: 'pcbang', x: 1, y: 5, dir: 'up' }, si: { map: 'pcbang', x: 2, y: 5, dir: 'up' }, yc: { map: 'pcbang', x: 6, y: 5, dir: 'up' } }[fid];
    if (pos) return pos;
    if (fid === 'mn') return S.q.stage < 1 ? { map: 'field', x: 11, y: 9, dir: 'right' } : { map: 'pcbang', x: 8, y: 6, dir: 'left' };
    return null;
  },
  friendTalk: {
    cw: async e => { await say(e.name, '아이디 "남산중워딩머신". 벙커링은 내가 막는다. 넌 한 방을 준비해.'); },
    si: async e => { await say(e.name, '영채 빌드 정찰해 뒀어. 그림으로. …지도라고 불러 줄래?'); },
    yc: async e => { await say(e.name, '3:1 핸디캡? 필요 없어. 준비되면 시작해.'); },
    mn: async e => { await say(e.name, '난 관전. 지면 늑대의 황태자 칭호는 내가 가져간다?'); }
  },
  npcTalk: {
    pcAlba: async e => { await say(e.name, '오늘 3:1 매치 소문 다 났다. 세 자리 나란히 잡아 놨어.'); },
    stuPc: async e => { await say(e.name, '(속닥) 저기 혼자 앉은 애가 영채? 포스가…'); }
  },
  interact(mapId, x, y, ch) {
    if (mapId !== 'pcbang' || ch !== 'm' || S.q.stage < 1) return null;
    return async () => { await QUESTS.hs.battle(); };
  },
  async battle() {
    await say('', '스타크래프트 접속. 방 제목: 「영채 이기면 인정」. 철우·상일·현식 vs 영채.');
    await say('정영채', '시작하자. 봐주기 없다?');
    let myHP = 3, ycHP = 3, units = 0, round = 0;
    while (myHP > 0 && ycHP > 0) {
      const ycAct = ['확장', '공격', '공격'][round % 3];
      const opts = ['병력 모으기 (+1)', '수비 태세 (영채 공격 무효)', '치고 빠지기 (병력 1 소모, 피해 1)'];
      if (units >= 3) opts.push('★ 늑대의 포효 — 모은 전 병력 총공격');
      const i = await ask('강현식', '아군 병력 ' + units + ' · 우리 기지 ' + myHP + ' · 영채 기지 ' + ycHP + '\n영채의 낌새: ' + (ycAct === '확장' ? '조용하다…' : '병력이 움직인다!'), opts);
      let defended = false;
      if (i === 0) {
        units++;
        await say(['오철우', '이상일', '강현식'][units % 3], ['벙커 완성! 버티는 건 내 전문이다.', '멀티 위치 그려 뒀어. 정찰 완료.', '좋아… 병력이 모인다. 조금만 더.'][units % 3]);
      } else if (i === 1) { defended = true; await say('강현식', '전원 수비 태세. 들어와 봐라.'); }
      else if (i === 2) {
        if (units >= 1) { units--; ycHP--; await say('강현식', '치고 빠진다! 영채 기지 타격! (영채 기지 ' + ycHP + ')'); }
        else await say('이상일', '보낼 병력이 없어…!');
      } else { ycHP = 0; await say('강현식', '전 병력… 늑대의 포효다. 아우우우──!'); await say('', '세 방향 총공격! 영채의 본진이 무너진다!'); break; }
      if (ycHP <= 0) break;
      if (ycAct === '공격') {
        if (defended) await say('', '영채의 드랍을 막아 냈다!');
        else { myHP--; if (myHP > 0) await say('정영채', '본진 비었네? (우리 기지 ' + myHP + ')'); else await say('정영채', 'GG 쳐라.'); }
      } else await say('', '영채는 조용히 확장 중이다…');
      round++;
    }
    if (ycHP <= 0) {
      await say('정영채', '…GG. 셋이 손발이 맞네. 특히 현식이 너.');
      await say('오철우', '봤냐! 현식이 마지막 한 방!');
      await say('이상일', '이 순간을 그려야 한다. 제목은 「포효」.');
      await say('강현식', '늑대의 황태자, 오늘도 포효한다. 아우우우─!');
      await say('박민', '(관전평) 3:1인데 왜 우리가 더 긴장했지…');
      await finishQuest();
    } else {
      await say('정영채', '역시 아직은 나네. 한 판 더?');
      await say('강현식', '…한 번만 더. 이번엔 병력을 더 모은다. (컴퓨터 앞에서 A)');
    }
  }
};

// --- 박민: 피자헛 샐러드바 탑 쌓기 ---
QUESTS.mn = {
  start: { map: 'pizza', x: 5, y: 3, dir: 'down' },
  init(q) { q.stage = 0; },
  goal(q) { return q.stage < 1 ? '친구들과 작전 회의' : '샐러드바에서 12단 쌓기 (샐러드바 앞에서 A)'; },
  hint() { return '샐러드바는 피자헛 오른쪽 위. 좌우로 움직이는 재료를 탭(Z)으로 얹는다. 가운데 겹칠수록 안 무너진다.'; },
  async intro() {
    await say('박민', '오랜만에 다 모였다. 그리고 여기는 피자헛… 샐러드바 앞.');
    await say('김창길', '한 번만 갖다 먹기 규칙. 즉, 한 접시의 가치를 극대화해야 한다.');
    await say('오철우', '접시 위에 탑을 쌓자. 무너지지 않게.');
    await say('박민', '내가 쌓아 올게. 다들 응원이나 해 줘.');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { markEnts([]); },
  friendPos(fid) { return PIZZA_SEATS[fid]; },
  friendTalk: {
    cw: async e => { await say(e.name, '옥수수를 아래 깔면 튼튼하대. 근거는 없어.'); },
    yc: async e => { await say(e.name, '가운데 정확히 얹는 게 요령이야. 요리하는 사람의 감이지.'); },
    si: async e => { await say(e.name, '무너지는 순간도 그림이 되긴 하는데… 성공하면 더 좋고.'); },
    hs: async e => { await say(e.name, '늑대는 사냥감을 한 번에 쌓는다. …아무튼 그렇다.'); },
    cg: async e => { await say(e.name, '12단이면 접시 단가가 3분의 1로 떨어진다. 부탁한다.'); }
  },
  npcTalk: {
    pizzaStaff: async e => { await say(e.name, '샐러드바는 1인 1회입니다~ (제발)'); }
  },
  interact(mapId, x, y, ch) {
    if (mapId !== 'pizza' || ch !== 'a' || S.q.stage < 1) return null;
    return async () => {
      await say('박민', '간다. 한 접시의 예술.');
      const win = await playStack(12);
      if (!win) { await say('박민', '후… 숨 고르고 다시 하자. (샐러드바 앞에서 A)'); return; }
      await say('', '민이 12단 샐러드 탑을 들고 자리로 돌아왔다. 탑은 걸을 때마다 출렁였다.');
      await say('오철우', '우와아아!! 피사의 사탑!');
      await say('강현식', '늑대의 황태… 아니, 샐러드의 황태자다.');
      await say('김창길', '접시 하나로 이 부피… 완벽한 효율이다. 감동적이다.');
      await say('피자헛 사장님', '맛있게 드세요, 학생들~ 하하…');
      await say('피자헛 사장님', '(…샐러드바 원가… 오늘 원가… 하하…)');
      await say('', '사장님은 웃고 있었지만, 마음속으로는 조용히 울고 있었다.');
      await say('박민', '역시 다 같이 먹으니까 맛있다. 난 그거면 됐어.');
      await showPhoto('super', '삼창슈퍼 — 피자 먹고 나오면 늘 여기서 아이스크림 하나', 3000);
      await finishQuest();
    };
  }
};

// --- 김창길: 은행에서 원금+이자 찾아서 "오늘은 내가 쏜다!" ---
QUESTS.cg = {
  start: { map: 'town', x: 17, y: 7, dir: 'down' },
  init(q) { q.stage = 0; q.money = 0; },
  goal(q) { return q.stage < 1 ? '오늘의 계획 확인' : q.stage === 1 ? '은행 창구에서 만기 예금 찾기' : '피자헛에 가서 친구들에게 쏘기'; },
  hint(q) { return q.stage < 2 ? '은행은 눈앞의 이 건물. 창구에서 이자 계산 문제가 나온다. 5%의 뜻을 떠올리자.' : '피자헛은 은행에서 오른쪽으로 한 건물.'; },
  async intro() {
    await say('김창길', '오늘은 그날이다. 1년 전 세뱃돈 50,000원을 정기예금에 넣은 날로부터… 만기일.');
    await say('김창길', '원금과 이자. 단 한 푼도 빠짐없이 찾는다.');
    S.q.stage = 1; setHud(); this.marks();
  },
  marks() { markEnts(S.q.stage === 1 ? ['teller'] : []); },
  friendPos(fid) { return S.q.stage >= 2 ? PIZZA_SEATS[fid] : null; },
  npcTalk: {
    teller: async e => {
      const q = S.q;
      if (q.stage !== 1) { await say(e.name, '저축을 저렇게 좋아하는 학생은 처음 봐요…'); return; }
      await say(e.name, '김창길 고객님. 정기예금 만기시네요. 통장이랑 도장 주세요.');
      await say('김창길', '(늘 몸에 지니고 다닌다) 여기요.');
      const i = await ask(e.name, '확인 문제 하나! 원금 50,000원, 연 이자 5%, 1년 만기. 이자는 얼마일까요?', ['2,500원', '5,000원', '500원']);
      if (i !== 0) { await say(e.name, '아쉽네요. 50,000원의 5%… 다시 계산해 보세요.'); await say('김창길', '(침착하자. 50,000 × 0.05다.)'); return; }
      await say(e.name, '정답! 이자 2,500원. 세금 15.4%를 떼면… 이자는 2,115원입니다.');
      await say('김창길', '세금 385원… 아프다. 그래도 이자는 이자다.');
      await say(e.name, '원금 합쳐 52,115원. 여기 있습니다. 부자 되세요!');
      q.stage = 2; q.money = 52115; got('52,115원 수령'); QUESTS.cg.marks();
      await say('김창길', '1년을 기다린 돈이다. 이 돈으로… 후후. 피자헛으로 간다.');
    }
  },
  async onEnter(mapId) {
    const q = S.q; if (mapId !== 'pizza' || q.stage !== 2 || q.finished) return;
    await sleep(300);
    await say('', '피자헛. 다섯 명이 모여 있다. 창길이 문을 열고 크게 외쳤다.');
    await say('김창길', '얘들아. 오늘은────── 내가 쏜다!!!');
    await say('', '일순간 정적. 그리고…');
    await say('오철우', '우와아아아아!!!');
    await say('강현식', '해가 서쪽에서 떴다!! 아우우우─!');
    await say('이상일', '이 장면 그린다. 제목은 「기적」.');
    await say('정영채', '창길이가?! 오늘 무슨 날이야?');
    await say('박민', '(감동) 김창길… 너 진짜 멋있다.');
    await say('김창길', '1년 이자까지 계산이 끝난 지출이다. 라지 한 판… 아니, 두 판 시켜라!');
    await say('피자헛 사장님', '학생, 멋있다! 사이다는 서비스!');
    await say('김창길', '(서비스… 오늘 수익률이 또 올랐다.)');
    await finishQuest();
  }
};

// ===== 엔딩 =====
async function playEnding() {
  quest = { friendPos: fid => ({ cg: { map: 'hill', x: 3, y: 17, dir: 'down' }, yc: { map: 'hill', x: 4, y: 17, dir: 'down' }, si: { map: 'hill', x: 5, y: 17, dir: 'down' },
    hs: { map: 'hill', x: 7, y: 17, dir: 'down' }, mn: { map: 'hill', x: 8, y: 17, dir: 'down' } })[fid], hideNpc: () => true, goal: () => '' };
  S.hero = 'cw'; S.q = { finished: true };
  showScreen('game'); fit(); setHud(); $('hudGoal').textContent = '';
  S.tint = 'rgba(255, 110, 30, 0.32)'; S.focus = { x: 6, y: 16 };
  await goMap('hill', 6, 16, 'down', true);
  S.busy = true;
  const d = S.done;
  await say('', '해가 지는 학교 언덕. 여섯이 나란히 내려간다.');
  await say('오철우', d.cw ? '오늘 골 봤지. 그리고 은하탕에서… 아니다. 아무것도.' : '내일은 축구다. 언덕 왕복 정도야.');
  await say('정영채', d.yc ? '남궁진은… 좋은 애야. 근데 난 바빠. 여러모로.' : '내일 급식 뭐더라. 내가 좀 도와야 하는데.');
  await say('이상일', d.si ? '영채 초상화 잘 나왔지. 보답도 확실했고. 후후.' : '다음엔 여섯 명 다 그려야지. 여섯 칸짜리로.');
  await say('강현식', d.hs ? '3:1 스타는 역사에 남는다. 마지막 포효… 크으.' : '늑대의 황태자는 지지 않는다. 언젠가 보여 주지.');
  await say('김창길', d.cg ? '오늘은 내가 쐈다. 다들 잊지 마라. 1년에 한 번뿐이다.' : '아껴야 잘 산다. 근데 가끔은… 아니다.');
  await say('박민', d.mn ? '샐러드 12단… 사장님껜 죄송하지만, 최고였다.' : '다 모였네. 난 그거면 됐어.');
  await say('', '…');
  await say('', '그리고 시간이 꽤 흘렀다.');
  await fade(true);
  const c = $('credits'); c.innerHTML = '';
  const add = (t, cls) => { const p = document.createElement('p'); p.textContent = t; if (cls) p.className = cls; p.style.margin = '0 0 10px'; c.appendChild(p); };
  add(ERA + ', 부산 남산중학교');
  add(FRIENDS.map(f => f.name).join(' · '), 'names');
  FINAL_MESSAGE.split('\n').forEach(l => add(l));
  add('BGM: 평화로운 피아노 브금 · A hisa – Dreamin’');
  add('— ' + MAKER + ' 만듦 —');
  S.tint = null; S.focus = null; quest = null;
  showScreen('end');
  $('fade').classList.remove('on'); S.busy = false;
}

// ----- 배경음악: 첫 터치/키 입력 뒤에 재생(브라우저 정책), 오른쪽 위 버튼으로 켜고 끔 -----
const BGM_LIST = ['bgm1.mp3', 'bgm2.mp3'];   // 1: 평화로운 피아노 브금, 2: A hisa - Dreamin'
const bgm = new Audio();
bgm.volume = 0.35;
let bgmIdx = 0, bgmOn = store.get('namsan_bgm', true), bgmTried = false;
bgm.src = BGM_LIST[0];
bgm.addEventListener('ended', () => { bgmIdx = (bgmIdx + 1) % BGM_LIST.length; bgm.src = BGM_LIST[bgmIdx]; bgmPlay(); });
function bgmBtn() { $('btnBgm').textContent = bgmOn ? '🔊' : '🔇'; }
function bgmPlay() { if (bgmOn) bgm.play().catch(() => {}); }
function bgmFirst() { if (bgmTried) return; bgmTried = true; bgmPlay(); }
window.addEventListener('pointerdown', bgmFirst, true);
window.addEventListener('keydown', bgmFirst, true);
$('btnBgm').addEventListener('click', e => {
  e.stopPropagation();
  bgmOn = !bgmOn; store.set('namsan_bgm', bgmOn); bgmBtn();
  if (bgmOn) { bgmTried = true; bgmPlay(); } else bgm.pause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else if (bgmOn && bgmTried) bgmPlay(); });
bgmBtn();

boot();
if (/[?&]debug=1/.test(location.search)) window.NS = { S, MAPS, tick: now => { update(now); draw(); }, goMap, say, startHero, finishQuest, findEnt, MG, showPhoto };

})();
