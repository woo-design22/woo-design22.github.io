<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Segoe UI', Pretendard, sans-serif;
    color: var(--text-dark);
    padding: 24px 16px;
    touch-action: none;
  }
  .header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 2.4rem; margin: 0; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board);
    color: white;
    border-radius: 8px;
    padding: 6px 16px;
    text-align: center;
  }
  .score-box .label { font-size: 0.65rem; opacity: 0.8; }
  .score-box .value { font-size: 1.1rem; font-weight: 700; }

  .toolbar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar p { font-size: 0.85rem; margin: 0; max-width: 240px; }
  #newGameBtn {
    background: #8f7a66;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .board-wrap { position: relative; }
  #board {
    background: var(--board);
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: min(420px, 90vw);
    height: min(420px, 90vw);
  }
  .cell {
    background: var(--cell);
    border-radius: 6px;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 700;
    transition: top 0.12s ease, left 0.12s ease, transform 0.12s ease;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(250,248,239,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    gap: 12px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 1.8rem; }
  .overlay button {
    background: #8f7a66;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="header">
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box"><div class="label">점수</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">최고</div><div class="value" id="best">0</div></div>
  </div>
</div>
<div class="toolbar">
  <p>타일을 합쳐서 <strong>2048</strong>을 만드세요! 방향키 또는 스와이프로 조작합니다.</p>
  <button id="newGameBtn">새 게임</button>
</div>

<div class="board-wrap">
  <div id="board"></div>
  <div class="overlay" id="overlay">
    <h2 id="overlayText">게임 종료</h2>
    <button id="retryBtn">다시 시도</button>
  </div>
</div>

<script>
(function () {
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const newGameBtn = document.getElementById('newGameBtn');
  const retryBtn = document.getElementById('retryBtn');

  let grid, score, best, gameOver, won;

  // file:// 이나 쿠키 차단 환경에서 localStorage 접근이 예외를 던져도
  // 게임 전체가 멈추지 않도록 감싼다.
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  };

  best = Number(store.get('2048_best') || 0);
  bestEl.textContent = best;

  const tileColors = {
    2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#f9f6f2'],
    16: ['#f59563', '#f9f6f2'], 32: ['#f67c5f', '#f9f6f2'], 64: ['#f65e3b', '#f9f6f2'],
    128: ['#edcf72', '#f9f6f2'], 256: ['#edcc61', '#f9f6f2'], 512: ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'], 2048: ['#edc22e', '#f9f6f2']
  };

  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function getCellRect() {
    const gap = 10, pad = 10;
    const boardSize = boardEl.clientWidth;
    const cellSize = (boardSize - pad * 2 - gap * (SIZE - 1)) / SIZE;
    return { cellSize, gap, pad };
  }

  function positionTile(el, r, c) {
    const { cellSize, gap, pad } = getCellRect();
    el.style.width = cellSize + 'px';
    el.style.height = cellSize + 'px';
    el.style.left = (pad + c * (cellSize + gap)) + 'px';
    el.style.top = (pad + r * (cellSize + gap)) + 'px';
    el.style.fontSize = (cellSize * 0.4) + 'px';
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    document.querySelectorAll('.tile').forEach(t => t.remove());
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (!val) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        el.textContent = val;
        const [bg, fg] = tileColors[val] || ['#3c3a32', '#f9f6f2'];
        el.style.background = bg;
        el.style.color = fg;
        positionTile(el, r, c);
        boardEl.appendChild(el);
      }
    }
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      store.set('2048_best', best);
      bestEl.textContent = best;
    }
  }

  function slideRowLeft(row) {
    const filtered = row.filter(v => v !== 0);
    const result = [];
    let gained = 0;
    for (let i = 0; i < filtered.length; i++) {
      if (filtered[i] === filtered[i + 1]) {
        const merged = filtered[i] * 2;
        result.push(merged);
        gained += merged;
        if (merged === 2048) won = true;
        i++;
      } else {
        result.push(filtered[i]);
      }
    }
    while (result.length < SIZE) result.push(0);
    return { row: result, gained };
  }

  function rotateGridCW(g) {
    const ng = emptyGrid();
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        ng[c][SIZE - 1 - r] = g[r][c];
    return ng;
  }

  function move(direction) {
    if (gameOver) return;
    let rotations = { left: 0, up: 3, right: 2, down: 1 }[direction];
    let g = grid;
    for (let i = 0; i < rotations; i++) g = rotateGridCW(g);

    let moved = false;
    let totalGain = 0;
    const newG = [];
    for (let r = 0; r < SIZE; r++) {
      const { row, gained } = slideRowLeft(g[r]);
      if (row.join(',') !== g[r].join(',')) moved = true;
      totalGain += gained;
      newG.push(row);
    }

    let finalG = newG;
    for (let i = 0; i < (4 - rotations) % 4; i++) finalG = rotateGridCW(finalG);

    if (moved) {
      grid = finalG;
      score += totalGain;
      addRandomTile();
      render();
      checkGameState();
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function checkGameState() {
    if (won) {
      showOverlay('🎉 2048 달성!');
      won = false;
    } else if (!canMove()) {
      gameOver = true;
      showOverlay('😵 게임 종료');
    }
  }

  function showOverlay(text) {
    overlayText.textContent = text;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    gameOver = false;
    won = false;
    hideOverlay();
    addRandomTile();
    addRandomTile();
    render();
  }

  window.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let touchStart = null;
  boardEl.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  boardEl.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 20) return;
    if (absX > absY) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  newGameBtn.addEventListener('click', newGame);
  retryBtn.addEventListener('click', newGame);
  window.addEventListener('resize', render);

  newGame();
})();
</script>
</body>
</html>
