<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>우리가족 유럽여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b1a2e'/%3E%3Crect x='5' y='2' width='6' height='3' fill='%23222'/%3E%3Crect x='5' y='5' width='6' height='4' fill='%23f1c7a3'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23222'/%3E%3Crect x='9' y='6' width='1' height='1' fill='%23222'/%3E%3Crect x='4' y='9' width='8' height='4' fill='%23ff8fb1'/%3E%3Crect x='5' y='13' width='2' height='2' fill='%23345'/%3E%3Crect x='9' y='13' width='2' height='2' fill='%23345'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #1b1a2e;
  --stage-bg: #0e0d1a;
  --panel: #2a2942;
  --panel-edge: #6d6a9a;
  --text: #f4f1ff;
  --muted: #a7a3c9;
  --accent: #ffd166;
  --accent-2: #7bd389;
  --danger: #ef6f6c;
  --pad: #35345a;
  --pad-press: #575593;
  --btn-a: #d94b4b;
  --btn-b: #3f7fd9;
  --dlg: rgba(18, 17, 34, 0.96);
  --dlg-edge: #ffffff;
  --shadow: rgba(0,0,0,0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', Pretendard, sans-serif; overflow: hidden;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; }

#app {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  max-width: 560px; margin: 0 auto;
}
#stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--stage-bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  touch-action: none;
}
#cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* 상단 표시: 현재 친구 + 목표 */
#hud {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start;
  gap: 6px; padding: 6px; pointer-events: none; font-size: 13px;
}
#hud .who {
  background: var(--dlg); border: 2px solid var(--dlg-edge); border-radius: 6px;
  padding: 4px 8px; line-height: 1.3; max-width: 78%; box-shadow: 0 2px 0 var(--shadow);
}
#hud .who b { color: var(--accent); }
#hud .who span { color: var(--muted); display: block; font-size: 12px; }
#hud .menu + .menu { margin-left: 6px !important; }
#hud .menu {
  margin-left: auto; pointer-events: auto; background: var(--dlg); color: var(--text);
  border: 2px solid var(--dlg-edge); border-radius: 6px; width: 36px; height: 32px;
  font-size: 18px; line-height: 1; cursor: pointer; box-shadow: 0 2px 0 var(--shadow);
}

/* 대화창 */
#dlg {
  position: absolute; left: 6px; right: 6px; bottom: 6px; display: none;
  background: var(--dlg); border: 3px solid var(--dlg-edge); border-radius: 8px;
  padding: 10px 12px 12px; min-height: 88px; font-size: 16px; line-height: 1.45;
  box-shadow: 0 3px 0 var(--shadow); cursor: pointer;
}
#dlg.show { display: block; }
#dlg .name { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 3px; }
#dlg .text { white-space: pre-wrap; word-break: keep-all; }
#dlg .more { position: absolute; right: 10px; bottom: 6px; color: var(--accent); animation: bob 0.7s infinite alternate; }
#dlg .more.hide { display: none; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(3px); } }
#choices { display: none; margin-top: 8px; flex-direction: column; gap: 6px; }
#choices.show { display: flex; }
#choices button {
  text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--panel-edge);
  border-radius: 6px; padding: 8px 10px; font-size: 15px; cursor: pointer;
}
#choices button.sel, #choices button:active { background: var(--pad-press); border-color: var(--accent); }

/* 건물 이름표 (캔버스 위 DOM — 저해상도 캔버스보다 글자가 또렷하다) */
#labels { position: absolute; overflow: hidden; pointer-events: none; left: 0; top: 0; }
#labels .lb {
  position: absolute; transform: translate(-50%, -100%); background: rgba(18,17,34,0.82); color: #fff;
  font-size: 11px; line-height: 1.15; padding: 2px 6px 3px; border-radius: 4px; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.4);
}
#labels .lb.exit { background: rgba(255,209,102,0.94); color: #2a1d00; font-weight: 700; border-color: #fff1c2; }

/* 미니맵 */
#mini { position: absolute; right: 6px; top: 44px; image-rendering: pixelated; border: 2px solid var(--dlg-edge); border-radius: 4px; background: #0e0d1a; opacity: 0.92; }

/* 사진 연출 (추억 사진 몇 초 보여주기) */
#photo {
  position: absolute; inset: 0; z-index: 9; background: #000; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 16px; opacity: 0; transition: opacity 0.35s;
}
#photo.on { display: flex; }
#photo.show { opacity: 1; }
#photo img { max-width: 100%; max-height: 78%; border: 3px solid #fff; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
#photoCap { color: #fff; font-size: 15px; text-align: center; white-space: pre-line; line-height: 1.5; word-break: keep-all; }

/* 미니게임(샐러드 쌓기) 오버레이 */
#mg {
  position: absolute; inset: 0; z-index: 7; background: rgba(10,9,20,0.93); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 10px; touch-action: none;
}
#mg.show { display: flex; }
#mgCv { image-rendering: pixelated; border: 3px solid var(--dlg-edge); border-radius: 8px; background: #17162c; }
#mgInfo { color: var(--text); font-size: 14px; text-align: center; white-space: pre-line; line-height: 1.5; }

/* 비밀번호 잠금 */
#lockDots { display: flex; gap: 14px; margin: 6px 0 4px; }
#lockDots i, #careDots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--panel-edge); background: transparent; }
#lockDots i.on, #careDots i.on { background: var(--accent); border-color: var(--accent); }
#lockDots.bad i { border-color: var(--danger); animation: shake 0.3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#lockPad, #carePad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
#lockPad button, #carePad button {
  height: 58px; font-size: 22px; font-weight: 700; background: var(--panel); color: var(--text);
  border: 3px solid var(--panel-edge); border-radius: 12px; cursor: pointer; box-shadow: 0 3px 0 var(--shadow);
}
#lockPad button:active, #carePad button:active { transform: translateY(2px); }

/* 전환 페이드 */
#fade {
  position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
#fade.on { opacity: 1; }

/* 토스트(짧은 알림) */
#toast {
  position: absolute; left: 50%; top: 52px; transform: translateX(-50%); display: none;
  background: var(--accent); color: #2a1d00; font-weight: 700; font-size: 14px;
  padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); white-space: nowrap;
}
#toast.show { display: block; animation: toastin 2.2s forwards; }
@keyframes toastin { 0% { opacity: 0; transform: translate(-50%, -6px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* 가상 패드 */
#pad {
  flex: 0 0 auto; height: 186px; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; touch-action: none; background: var(--bg);
}
#dpad { position: relative; width: 156px; height: 156px; }
#dpad .k {
  position: absolute; width: 52px; height: 52px; background: var(--pad); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px;
  box-shadow: 0 3px 0 var(--shadow);
}
#dpad .k.on { background: var(--pad-press); color: var(--text); transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
#dpad .up { left: 52px; top: 0; } #dpad .down { left: 52px; top: 104px; }
#dpad .left { left: 0; top: 52px; } #dpad .right { left: 104px; top: 52px; }
#dpad .mid { left: 52px; top: 52px; background: var(--panel); box-shadow: none; border-radius: 0; }
#btns { display: flex; gap: 14px; align-items: flex-end; }
#btns button {
  width: 68px; height: 68px; border-radius: 50%; border: 0; color: #fff; font-weight: 800; font-size: 18px;
  box-shadow: 0 4px 0 var(--shadow); cursor: pointer; touch-action: none;
}
#btns button small { display: block; font-size: 10px; font-weight: 600; opacity: 0.85; }
#btnA { background: var(--btn-a); }
#btns #btnB { background: var(--btn-b); width: 56px; height: 56px; font-size: 15px; margin-bottom: 4px; }
#btns button.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }

/* 전체 화면 스크린(타이틀·친구 선택·메뉴·엔딩) */
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; padding: 20px; background: var(--bg); z-index: 5; overflow: auto;
  text-align: center;
}
.screen.show { display: flex; }
.screen h1 {
  margin: 0; font-size: 40px; letter-spacing: 2px; color: var(--accent);
  text-shadow: 3px 3px 0 #7a3b00, 6px 6px 0 rgba(0,0,0,0.4); line-height: 1.1;
}
.screen h1 small { display: block; font-size: 15px; letter-spacing: 6px; color: var(--muted); text-shadow: none; margin-bottom: 6px; }
.screen p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; word-break: keep-all; }
.screen .big {
  background: var(--panel); color: var(--text); border: 3px solid var(--panel-edge); border-radius: 10px;
  padding: 12px 28px; font-size: 18px; font-weight: 700; min-width: 200px; cursor: pointer; box-shadow: 0 4px 0 var(--shadow);
}
.screen .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.screen .big.primary { background: var(--accent); color: #2a1d00; border-color: #fff1c2; }
.screen .big:disabled { opacity: 0.4; cursor: default; }
#titleCv { image-rendering: pixelated; width: 264px; height: 96px; }

#roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
#roster button {
  background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 10px; color: var(--text);
  padding: 8px 4px 10px; cursor: pointer; position: relative; box-shadow: 0 3px 0 var(--shadow);
}
#roster button:active { transform: translateY(2px); }
#roster button.done { border-color: var(--accent-2); }
#roster button.done::after { content: '✔'; position: absolute; right: 6px; top: 4px; color: var(--accent-2); font-weight: 800; }
#roster canvas { image-rendering: pixelated; width: 48px; height: 48px; display: block; margin: 0 auto 4px; }
#roster b { display: block; font-size: 15px; }
#roster span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; word-break: keep-all; }

/* 복구 코드 입력란 — 있는 줄 모르게, 그러나 찾으면 보이게 */
#restoreBox { display: flex; gap: 6px; align-items: center; margin-top: 18px; opacity: 0.22; transition: opacity 0.25s; }
#restoreBox:hover, #restoreBox:focus-within { opacity: 1; }
#restoreIn {
  width: 74px; text-align: center; letter-spacing: 4px; font-family: inherit; font-size: 13px;
  background: transparent; color: var(--muted); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 4px 6px;
}
#restoreBtn {
  font-family: inherit; font-size: 12px; background: transparent; color: var(--muted);
  border: 1px solid var(--panel-edge); border-radius: 6px; padding: 5px 9px; cursor: pointer;
}
#restoreBox.ok #restoreIn, #restoreBox.ok #restoreBtn { color: var(--accent-2); border-color: var(--accent-2); }
#restoreBox.bad #restoreIn { color: var(--danger); border-color: var(--danger); }
#giftGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
#giftGrid button {
  background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 10px; color: var(--text);
  padding: 10px 4px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--shadow); font-size: 13px; line-height: 1.35;
}
#giftGrid button.own { border-color: var(--accent); }
#giftGrid button:disabled { opacity: 0.45; cursor: default; }
#giftGrid button .gi { display: block; font-size: 22px; margin-bottom: 4px; }
#menuList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
#goalBox {
  background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 8px; padding: 10px 12px;
  width: 100%; max-width: 300px; text-align: left; font-size: 14px; line-height: 1.5; word-break: keep-all;
}
#goalBox b { color: var(--accent); }

#credits { max-width: 360px; font-size: 15px; line-height: 1.7; color: var(--text); word-break: keep-all; }
#credits .names { color: var(--accent); font-weight: 700; font-size: 17px; }

@media (min-height: 760px) { #pad { height: 210px; } }
@media (max-height: 600px) { #pad { height: 150px; } #dpad { width: 132px; height: 132px; } #dpad .k { width: 44px; height: 44px; }
  #dpad .up,#dpad .mid,#dpad .down { left: 44px; } #dpad .down { top: 88px; } #dpad .left,#dpad .right,#dpad .mid { top: 44px; } #dpad .right { left: 88px; }
  #btns button { width: 58px; height: 58px; } #btns #btnB { width: 48px; height: 48px; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="176" height="208"></canvas>
    <div id="hud"><div class="who"><b id="hudName">—</b><span id="hudGoal"></span></div><button class="menu" id="btnBgm" aria-label="배경음악">🔊</button><button class="menu" id="btnMenu" aria-label="메뉴">☰</button></div>
    <div id="toast"></div>
    <div id="labels"></div>
    <canvas id="mini" width="24" height="18"></canvas>
    <div id="dlg"><div class="name" id="dlgName"></div><div class="text" id="dlgText"></div><div class="more" id="dlgMore">▼</div><div id="choices"></div></div>
    <div id="mg"><canvas id="mgCv" width="160" height="200"></canvas><div id="mgInfo"></div></div>
    <div id="fade"></div>
    <div id="photo"><img id="photoImg" alt="추억 사진"><div id="photoCap"></div></div>
  </div>
  <div id="pad">
    <div id="dpad">
      <div class="k up" data-d="up">▲</div><div class="k left" data-d="left">◀</div><div class="k mid"></div>
      <div class="k right" data-d="right">▶</div><div class="k down" data-d="down">▼</div>
    </div>
    <div id="btns">
      <button id="btnB">B<small>메뉴</small></button>
      <button id="btnA">A<small>말하기</small></button>
    </div>
  </div>

  <div class="screen" id="scrTitle">
    <h1><small>네 식구가 함께 걸은</small>우리가족<br>유럽여행</h1>
    <canvas id="titleCv" width="88" height="32"></canvas>
    <p>파리에서 스위스까지,<br>일곱 장면으로 다시 걷는 그때 그 여행.</p>
    <button class="big primary" id="btnNew">처음부터</button>
    <button class="big" id="btnContinue">이어하기</button>
    <p id="titleHint" style="font-size:12px">휴대폰 세로 화면에 맞춰져 있습니다. PC에서는 방향키 + Z(말하기) + X(메뉴)</p>
  </div>

  <div class="screen" id="scrSelect">
    <h1 style="font-size:26px">여행의 장면들</h1>
    <p>순서대로 열립니다. 끝낸 장면은 다시 볼 수 있어요.</p>
    <div id="roster"></div>
    <button class="big primary" id="btnEnding" style="display:none">엔딩 보기 ★</button>
    <button class="big" id="btnGift">보상함 🎁 <span id="giftCount"></span></button>
    <button class="big" id="btnToTitle">타이틀로</button>
    <div id="restoreBox"><input id="restoreIn" type="tel" inputmode="numeric" maxlength="4" placeholder="····" aria-label="복구 코드"><button id="restoreBtn" type="button">확인</button></div>
  </div>

  <div class="screen" id="scrMenu">
    <h1 style="font-size:26px">메뉴</h1>
    <div id="goalBox"></div>
    <div id="menuList">
      <button class="big primary" id="btnResume">계속하기</button>
      <button class="big" id="btnSwitch">장면 선택으로</button>
      <button class="big" id="btnRestartQuest">이 장면 처음부터</button>
    </div>
    <p style="font-size:12px">진행은 이 휴대폰(브라우저)에 자동 저장됩니다.</p>
  </div>

  <div class="screen" id="scrEnd">
    <h1 style="font-size:28px">그리고 지금</h1>
    <div id="credits"></div>
    <button class="big" id="btnEndClose">장면 선택으로</button>
  </div>

  <div class="screen" id="scrGift">
    <h1 style="font-size:26px">보상함 🎁</h1>
    <p>장면을 끝낼 때마다 추억이 하나씩 열립니다. 눌러서 크게 보세요.</p>
    <div id="giftGrid"></div>
    <button class="big" id="btnGiftClose">장면 선택으로</button>
  </div>

  <div class="screen show" id="scrLock">
    <h1 style="font-size:26px">🔒 우리가족 이야기</h1>
    <p>비밀번호 네 자리를 눌러 주세요.</p>
    <div id="lockDots"><i></i><i></i><i></i><i></i></div>
    <div id="lockPad"></div>
  </div>

</div>
<script>
(function () {
'use strict';
/* ===== 남산중 6인방 — 모바일용 도트 RPG =====
   단일 파일. 그림은 전부 코드 안의 픽셀 배열·도형으로 그린다(외부 파일 없음).
   구조: store → 상수/캐릭터 → 스프라이트 → 타일 → 맵 → 엔진(입력·이동·그리기) → 대화 UI → 퀘스트 대본 → 화면 전환/부팅 */

// ----- 영속 저장: localStorage가 막힌 환경에서도 앱이 죽지 않게 감싼다 -----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 무시 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
};
const SAVE_KEY = 'eu_save';

// ----- 선물하는 사람이 바꾸기 쉬운 것들 -----
// 게임 비밀번호 (관계자 전용)
const PASSWORD = '7139';
// 엔딩 크레딧 마지막 메시지. 줄바꿈은 \n
const FINAL_MESSAGE = '함께 걸었던 파리의 비 갠 오후와\n융프라우의 라면 한 젓가락.\n우리 네 사람이라서 여행이었다.';
const ERA = '우리가족 유럽여행';
const MAKER = '수지가 가족에게';

// ----- 상수 -----
const T = 16;            // 타일 한 변(px)
const VIEW_W = 11;       // 가로 타일 수(고정). 세로는 화면 높이에 맞춰 계산

// 도안 → 캔버스. 같은 도안을 색만 바꿔 여러 인물에 쓴다.
function drawPix(rows, pal, mirror) {
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x]; if (ch === '.') continue;
      let col = ch === 'k' || ch === 'e' ? OUTLINE : pal[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(mirror ? T - 1 - x : x, y, 1, 1);
    }
  }
  return c;
}
// 인물 하나의 프레임 묶음: frames[dir] = [서기, 걷기1, 서기, 걷기2]
function buildFrames(pal, sheet) {
  const src = sheet || SPR;
  const mk = (k, m) => drawPix(src[k], pal, m);
  const d0 = mk('down0'), d1 = mk('down1'), d2 = mk('down1', true);
  const u0 = mk('up0'), u1 = mk('up1'), u2 = mk('up1', true);
  const l0 = mk('left0'), l1 = mk('left1');
  const r0 = mk('left0', true), r1 = mk('left1', true);
  return { down: [d0, d1, d0, d2], up: [u0, u1, u0, u2], left: [l0, l1, l0, l1], right: [r0, r1, r0, r1] };
}

Object.keys(MAPS).forEach(id => {
  const m = MAPS[id]; m.id = id; m.h = m.rows.length; m.w = m.rows[0].length;
  m.rows.forEach((r, y) => { if (r.length !== m.w) console.error('맵 줄 길이 불일치', id, y, r.length, m.w); });
  m.baseRows = m.rows.map(r => {
    let out = '', last = m.base;
    for (let x = 0; x < r.length; x++) {
      const t = TILES[r[x]];
      if (t && (t.sky || (!t.solid && !t.over))) last = r[x];
      out += last;
    }
    return out;
  });
});

// ----- 화면 크기: 가로 11타일 고정, 세로는 남는 높이만큼. 정수 배율로 또렷하게 -----
function fit() {
  const st = $('stage').getBoundingClientRect();
  SCALE = Math.max(1, Math.floor(Math.min(st.width / (VIEW_W * T), st.height / (10 * T))));
  VIEW_H = Math.max(10, Math.min(18, Math.floor(st.height / (T * SCALE))));
  cv.width = VIEW_W * T; cv.height = VIEW_H * T;
  cv.style.width = (cv.width * SCALE) + 'px'; cv.style.height = (cv.height * SCALE) + 'px';
  ctx.imageSmoothingEnabled = false;
  syncLabelsBox();
}
window.addEventListener('resize', fit);

// ----- 입력: 키보드 + 가상 패드 둘 다 같은 held/pressA/pressB로 모인다 -----
let held = null;                 // 지금 누르고 있는 방향
const keyDir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right' };
const keysDown = new Set();
function heldFromKeys() { for (const k of keysDown) if (keyDir[k]) return keyDir[k]; return null; }
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  if (e.repeat) { if (keyDir[e.code]) e.preventDefault(); return; }
  if (keyDir[e.code]) { keysDown.add(e.code); held = keyDir[e.code]; e.preventDefault(); onDirPress(held); return; }
  if (S.screen === 'lock') { const mm = e.code.match(/^(?:Digit|Numpad)([0-9])$/); if (mm) { lockKey(mm[1]); return; } if (e.code === 'Backspace') { lockKey('←'); return; } }
  if (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); pressA(); }
  else if (e.code === 'KeyX' || e.code === 'Escape') { e.preventDefault(); pressB(); }
});
window.addEventListener('keyup', e => { if (keyDir[e.code]) { keysDown.delete(e.code); held = heldFromKeys(); } });
window.addEventListener('blur', () => { keysDown.clear(); held = null; padDir(null); });

// 가상 방향패드: 패드 영역 안에서 손가락 위치의 각도로 방향을 정한다(버튼 사이를 미끄러져도 됨)
const dpad = $('dpad');
function padDir(d) {
  held = d;
  dpad.querySelectorAll('.k').forEach(k => k.classList.toggle('on', !!d && k.dataset.d === d));
  if (d) onDirPress(d);
}
function dirFromPointer(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.12) return held; // 중앙 근처면 이전 방향 유지
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
let padPointer = null;
dpad.addEventListener('pointerdown', e => { padPointer = e.pointerId; dpad.setPointerCapture(e.pointerId); padDir(dirFromPointer(e)); e.preventDefault(); });
dpad.addEventListener('pointermove', e => { if (padPointer === e.pointerId) padDir(dirFromPointer(e)); });
const padEnd = e => { if (padPointer === e.pointerId) { padPointer = null; padDir(null); } };
dpad.addEventListener('pointerup', padEnd); dpad.addEventListener('pointercancel', padEnd);
dpad.addEventListener('contextmenu', e => e.preventDefault());

function bindBtn(el, fn) {

  const off = () => el.classList.remove('on');
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// ----- 대화창 -----
// say(): 한 마디 보여주고 탭/Z를 기다림. ask(): 선택지. 둘 다 Promise라 대본을 순서대로 쓸 수 있다.
const dlg = $('dlg'), dlgName = $('dlgName'), dlgText = $('dlgText'), dlgMore = $('dlgMore'), choicesEl = $('choices');
let dlgState = null;   // { full, shown, timer, resolve, choices, sel }
function say(name, text) {
  return new Promise(resolve => {
    S.busy = true;
    dlg.classList.add('show'); choicesEl.classList.remove('show'); choicesEl.innerHTML = '';
    dlgName.textContent = name || ''; dlgName.style.display = name ? '' : 'none';
    dlgMore.classList.add('hide');
    dlgState = { full: text, shown: 0, resolve, choices: null };
    dlgText.textContent = '';
    const tick = () => {
      if (!dlgState || dlgState.full !== text) return;
      dlgState.shown = Math.min(text.length, dlgState.shown + 1);
      dlgText.textContent = text.slice(0, dlgState.shown);
      if (dlgState.shown < text.length) dlgState.timer = setTimeout(tick, 22);
      else dlgMore.classList.remove('hide');
    };
    tick();
  });
}
function ask(name, text, options) {
  return new Promise(async resolve => {
    await say(name, text);
    // say가 끝난 직후 선택지를 붙인다
    S.busy = true;
    dlg.classList.add('show'); dlgMore.classList.add('hide');
    dlgName.textContent = name || ''; dlgText.textContent = text;
    dlgState = { full: text, shown: text.length, resolve, choices: options, sel: 0 };
    choicesEl.innerHTML = ''; choicesEl.classList.add('show');
    options.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o; b.type = 'button';
      if (i === 0) b.classList.add('sel');
      b.addEventListener('click', e => { e.stopPropagation(); finishChoice(i); });
      choicesEl.appendChild(b);
    });
  });
}
function finishChoice(i) {
  const st = dlgState; if (!st || !st.choices) return;
  dlgState = null; closeDlg(); st.resolve(i);
}
function closeDlg() { dlg.classList.remove('show'); choicesEl.classList.remove('show'); choicesEl.innerHTML = ''; S.busy = false; }
// 대화 진행(탭/Z). 글자가 나오는 중이면 전부 보여주고, 다 나왔으면 다음으로.
function advanceDlg() {
  const st = dlgState; if (!st) return false;
  if (st.choices) { finishChoice(st.sel); return true; }
  if (st.shown < st.full.length) { clearTimeout(st.timer); st.shown = st.full.length; dlgText.textContent = st.full; dlgMore.classList.remove('hide'); return true; }
  dlgState = null; closeDlg(); st.resolve();
  return true;
}
// 대사창이 떠 있으면 화면의 빈 곳 아무 데나 눌러도 넘어간다.
// 버튼·방향패드·선택지처럼 제 기능이 있는 곳은 제외하고, 미니게임 중에는 그쪽 입력이 우선이다.
// 선택지가 떠 있을 땐 빈 곳 탭으로 고르지 않는다(실수 방지) — 선택지 버튼이나 A 로만.
const TAP_SKIP = 'button, #dpad, #choices, #care, #mg, #photo, .screen, textarea, input';
$('app').addEventListener('pointerdown', e => {
  if (MG.active) return;
  if (!dlgState || dlgState.choices) return;
  if (e.target.closest(TAP_SKIP)) return;
  e.preventDefault();
  advanceDlg();
});
function moveChoice(d) {
  const st = dlgState; if (!st || !st.choices) return false;
  st.sel = (st.sel + d + st.choices.length) % st.choices.length;
  choicesEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sel', i === st.sel));
  return true;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('show');
  void t.offsetWidth; t.classList.add('show');
}
async function fade(on) { $('fade').classList.toggle('on', on); await sleep(260); }

// ----- 맵·엔티티 도우미 -----
let quest = null;  // 지금 플레이 중인 친구의 대본(QUESTS[id])
const tileAt = (m, x, y) => (x < 0 || y < 0 || x >= m.w || y >= m.h) ? null : m.rows[y][x];
function isSolidTile(m, x, y) { const ch = tileAt(m, x, y); if (ch === null) return true; const t = TILES[ch]; return !t || !!t.solid; }
function entAt(x, y) { return S.ents.find(e => !e.gone && e.x === x && e.y === y); }
function exitAt(x, y) { return S.map.exits.find(e => e.edge === 'bottom' ? y === S.map.h - 1 : (e.x === x && e.y === y)); }
function findEnt(id) { return S.ents.find(e => e.id === id && !e.gone); }

// 맵에 들어갈 때 그 맵의 사람·친구·아이템을 놓는다
function buildEnts() {
  const id = S.map.id; S.ents = [];
  (NPCS[id] || []).forEach(n => {
    if (quest && quest.hideNpc && quest.hideNpc(n.id)) return;
    const ov = quest && quest.npcPos && quest.npcPos(n.id);
    S.ents.push(Object.assign({ kind: 'npc' }, n, ov || {}));
  });
  FRIENDS.forEach(f => {
    if (f.id === S.hero) return;
    const pos = (quest && quest.familyPos && quest.familyPos(f.id)) || HOME[f.id];
    if (pos && pos.map === id) S.ents.push({ kind: 'friend', id: f.id, spr: pos.spr || f.id, name: f.name, x: pos.x, y: pos.y, dir: pos.dir || 'down' });
  });
  if (quest && quest.ents) quest.ents(id).forEach(e => S.ents.push(e));
  if (quest && quest.marks) quest.marks();
}
// 바닥에 놓인 아이템 하나 만들기. 밟으면 onPick
function item(id, icon, x, y, onPick) { return { kind: 'item', id, icon, x, y, solid: false, onPick, mark: true }; }

// ----- 이동 -----
function startMove(nx, ny, after) { S.moving = { fx: S.px, fy: S.py, t0: S.time, after }; S.px = nx; S.py = ny; }
function tryMove(d) {
  S.dir = d;
  const [dx, dy] = DIRS[d], nx = S.px + dx, ny = S.py + dy;
  const e = entAt(nx, ny);
  if (e && e.kind === 'ball') {               // 공 차기: 공이 한 칸 굴러가고 나도 그 자리로
    const bx = nx + dx, by = ny + dy;
    if (isSolidTile(S.map, bx, by) || entAt(bx, by)) return false;
    e.moving = { fx: e.x, fy: e.y, t0: S.time }; e.x = bx; e.y = by;
    startMove(nx, ny, async () => { if (tileAt(S.map, e.x, e.y) === 'n' && quest && quest.onGoal) { S.lock = true; await quest.onGoal(e); S.lock = false; } });
    return true;
  }
  if (isSolidTile(S.map, nx, ny)) return false;
  if (e && e.solid !== false) return false;
  startMove(nx, ny);
  return true;
}
async function arrive() {
  const x = S.px, y = S.py;
  const it = entAt(x, y);
  if (it && it.kind === 'item') { it.gone = true; if (it.onPick) await it.onPick(it); }
  const ex = exitAt(x, y);
  if (S.onExit) { if (!ex) S.onExit = false; }
  else if (ex) { goMap(ex.to, ex.tx, ex.ty, ex.dir); return; }
  if (quest && quest.onStep) quest.onStep(S.map.id, x, y);
}
async function goMap(id, x, y, dir, silent) {
  S.busy = true;
  await fade(true);
  S.map = MAPS[id]; S.px = x; S.py = y; if (dir) S.dir = dir; S.moving = null;
  buildEnts(); S.onExit = !!exitAt(x, y);
  draw();
  await fade(false);
  S.busy = false;
  if (!silent) toast(S.map.name);
  if (quest && quest.onEnter) { S.lock = true; await quest.onEnter(id); S.lock = false; }
  save();
}
// NPC를 한 칸씩 걸어가게 한다(대본용). 막히면 그냥 순간이동
async function walkEnt(e, path) {
  e.walk = true;
  for (const d of path) {
    const [dx, dy] = DIRS[d]; e.dir = d;
    e.moving = { fx: e.x, fy: e.y, t0: S.time }; e.x += dx; e.y += dy;
    await sleep(WALK_MS);
  }
  e.walk = false;
}

function drawChar(spr, dir, frame, x, y) { const fr = SPRITES[spr]; if (fr) ctx.drawImage(fr[dir] ? fr[dir][frame] : fr.down[0], Math.round(x), Math.round(y)); }
// ----- 하늘: sky 맵은 배경이 검정이 아니라 하늘이다. S.weather 로 비/갬이 바뀐다 -----
const SKY = {
  rain:  { bg: '#71818f', cloud: '#59626f', sun: null },
  clear: { bg: '#8fc4ea', cloud: '#f2f7fb', sun: '#ffe9a3' }
};
// 구름·해는 탑을 피해서 놓는다 — 탑 타일이 하늘색으로 꽉 찬 사각형이라 겹치면 잘려 보인다
const SKY_CLOUDS = [[0.4, 1.6, 0.75], [2.6, 3.2, 0.5], [13.4, 2.9, 0.6]];  // 타일 좌표
const SUN_AT = [11.6, 1.3];
// 에펠탑: 타일로 쪼개면 타일 경계마다 끊겨 보인다. 하늘 위에 한 덩어리로 그린다.
// 좌표계 원점 = 탑 한가운데(7.5타일), 바닥 = 광장 첫 줄(4타일). 위로 갈수록 y 가 작다.
function drawTower(camX, camY) {
  const cx = Math.round(7.5 * T - camX), gy = Math.round(4 * T - camY);
  const lo = '#7a5a38', mid = '#8a6a44', hi = '#9a7a50';
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(cx + x, gy + y, w, h); };
  R(-1, -64, 2, 8, lo);                                       // 안테나
  R(-4, -56, 8, 4, mid);                                      // 꼭대기 전망대
  R(-3, -52, 6, 8, hi); R(-1, -52, 2, 8, lo);                 // 좁은 몸통
  R(-11, -44, 22, 4, mid);                                    // 2층 전망대
  R(-8, -40, 16, 10, hi);                                     // 몸통
  R(-6, -40, 2, 10, lo); R(4, -40, 2, 10, lo);                // 격자
  R(-20, -30, 40, 4, mid);                                    // 1층 전망대
  const legs = [[-26, 6, 9, 14], [-20, 6, 13, 19], [-14, 7, 17, 24], [-7, 7, 21, 30]];
  for (const [y, h, i0, i1] of legs) {                        // 네 다리(밖으로 벌어진다)
    R(-i1, y, i1 - i0, h, hi); R(i0, y, i1 - i0, h, hi);
    R(-i1 + 1, y, 2, h, lo);   R(i1 - 3, y, 2, h, lo);
  }
  R(-17, -24, 34, 3, mid);                                    // 아치 윗변
  R(-21, -21, 5, 3, mid); R(16, -21, 5, 3, mid);              // 아치 어깨
}
function drawSky(camX, camY) {
  const w = SKY[S.weather] || SKY.clear;
  ctx.fillStyle = w.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  if (w.sun) {
    const sx = SUN_AT[0] * T - camX, sy = SUN_AT[1] * T - camY;
    ctx.fillStyle = 'rgba(255,236,180,0.35)'; ctx.beginPath(); ctx.arc(sx, sy, 17, 0, 7); ctx.fill();
    ctx.fillStyle = w.sun; ctx.beginPath(); ctx.arc(sx, sy, 10, 0, 7); ctx.fill();
  }
  ctx.fillStyle = w.cloud;
  for (const [cx, cy, s] of SKY_CLOUDS) {
    const x = cx * T - camX, y = cy * T - camY;
    ctx.beginPath();
    ctx.arc(x, y, 7 * s, 0, 7); ctx.arc(x + 10 * s, y - 3 * s, 9 * s, 0, 7); ctx.arc(x + 21 * s, y, 6.5 * s, 0, 7);
    ctx.fill();
    ctx.fillRect(x, y, 21 * s, 7 * s);
  }
  drawTower(camX, camY);
}
// 빗줄기: 비 오는 동안 화면 전체에 사선으로 흐른다
function drawRain(now) {
  ctx.strokeStyle = 'rgba(206,220,235,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 46; i++) {
    const x = (i * 47 + Math.floor(now / 9)) % (cv.width + 24) - 12;
    const y = (i * 61 + Math.floor(now / 2)) % (cv.height + 24) - 12;
    ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 7);
  }
  ctx.stroke();
}
function draw() {
  if (!S.map) return;
  const m = S.map, now = S.time;
  let ppx = S.px, ppy = S.py;
  if (S.moving) { const k = Math.min(1, (now - S.moving.t0) / WALK_MS); ppx = S.moving.fx + (S.px - S.moving.fx) * k; ppy = S.moving.fy + (S.py - S.moving.fy) * k; }
  const focus = S.focus || { x: ppx, y: ppy };
  let camX = focus.x * T + T / 2 - cv.width / 2, camY = focus.y * T + T / 2 - cv.height / 2;
  const maxX = m.w * T - cv.width, maxY = m.h * T - cv.height;
  camX = Math.round(maxX < 0 ? maxX / 2 : Math.max(0, Math.min(maxX, camX)));
  camY = Math.round(maxY < 0 ? maxY / 2 : Math.max(0, Math.min(maxY, camY)));
  if (m.sky) drawSky(camX, camY);
  else { ctx.fillStyle = '#0e0d1a'; ctx.fillRect(0, 0, cv.width, cv.height); }
  const x0 = Math.floor(camX / T), y0 = Math.floor(camY / T);
  for (let y = y0; y <= y0 + VIEW_H; y++) for (let x = x0; x <= x0 + VIEW_W; x++) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
    const ch = m.rows[y][x], t = TILES[ch], sx = x * T - camX, sy = y * T - camY;
    if (t && t.over) { const bs = ATLAS[m.baseRows[y][x]]; if (bs) ctx.drawImage(bs, sx, sy); }   // 하늘 바닥은 그림이 없다
    const img = ATLAS[ch]; if (img) ctx.drawImage(img, sx, sy);
  }
  const list = S.ents.filter(e => !e.gone).map(e => ({ e, y: e.y }));
  if (!S.hideHero) list.push({ player: true, y: ppy });
  list.sort((a, b) => a.y - b.y);
  const bob = Math.round(Math.sin(now / 220)) ;
  for (const it of list) {
    if (it.player) { drawChar(S.heroSpr || S.hero, S.dir, S.moving ? [1, 3][S.step % 2] : 0, ppx * T - camX, ppy * T - camY); continue; }
    const e = it.e; let ex = e.x, ey = e.y;
    if (e.moving) { const k = Math.min(1, (now - e.moving.t0) / WALK_MS); if (k >= 1) e.moving = null; else { ex = e.moving.fx + (e.x - e.moving.fx) * k; ey = e.moving.fy + (e.y - e.moving.fy) * k; } }
    const sx = Math.round(ex * T - camX), sy = Math.round(ey * T - camY);
    if (e.kind === 'item') ctx.drawImage(ICONS[e.icon] || ICONS.paper, sx, sy + bob);
    else if (e.kind === 'ball') ctx.drawImage(ICONS.ball, sx, sy);
    else drawChar(e.spr, e.dir || 'down', e.walk ? [1, 3][Math.floor(now / WALK_MS) % 2] : 0, sx, sy);
    if (e.mark && e.kind !== 'item') ctx.drawImage(ICONS.mark, sx, sy - 12 + bob);
  }
  if (m.sky && S.weather === 'rain') drawRain(now);
  if (S.tint) { ctx.fillStyle = S.tint; ctx.fillRect(0, 0, cv.width, cv.height); }
  updateLabels(camX, camY); drawMini();
}

// ----- 추억 사진 연출: photos/<이름>.jpg 를 ms 동안 보여준다. 파일이 없으면 설명 카드로 대신 -----
async function showPhoto(keys, caption, ms) {
  if (typeof keys === 'string') keys = [keys];
  const wasBusy = S.busy; S.busy = true;   // 사진 나오는 동안 조작 잠금
  const ph = $('photo'), img = $('photoImg'), cap = $('photoCap');
  let ok = false;
  // 1) 뒤섞어 둔 .bin (비밀번호 기반 XOR) 먼저 — 공개 저장소에 원본이 그대로 올라가지 않게
  for (const k of keys) {
    try {
      const res = await fetch('photos/' + k + '.bin');
      if (res.ok) {
        const buf = new Uint8Array(await res.arrayBuffer());
        const key = (PASSWORD + PASSWORD).split('').map(ch => ch.charCodeAt(0));
        for (let i = 0; i < buf.length; i++) buf[i] ^= key[i % key.length] ^ ((i * 7) & 0xff);
        img.src = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
        await new Promise(r => { img.onload = r; img.onerror = r; });
        ok = true; break;
      }
    } catch (e) { /* 다음 방법 */ }
  }
  if (!ok) outer: for (const k of keys) for (const ext of ['jpg', 'png', 'jpeg', 'webp']) {
    ok = await new Promise(res => {
      const im = new Image(); const t = setTimeout(() => res(false), 2500);
      im.onload = () => { clearTimeout(t); img.src = im.src; res(true); };
      im.onerror = () => { clearTimeout(t); res(false); };
      im.src = 'photos/' + k + '.' + ext;
    });
    if (ok) break outer;
  }
  img.style.display = ok ? '' : 'none';
  cap.textContent = caption + (ok ? '' : '\n(couple-rpg/photos/' + keys[0] + '.jpg 파일을 넣으면 실제 사진이 나옵니다)');
  ph.classList.add('on'); void ph.offsetWidth; ph.classList.add('show');
  await sleep(ms);
  ph.classList.remove('show'); await sleep(380); ph.classList.remove('on');
  S.busy = wasBusy;
}

const MG = { active: false, tap: null, cancel: null };

// 드론 비행: 탭하면 떠오르고, 놓으면 내려간다. 링 8개를 통과하면 성공
function playDrone(target) {
  return new Promise(resolve => {
    const g = mgOpen();
    let y, vy, gates, passed, over, win, t;
    const reset = () => { y = 100; vy = 0; gates = [{ x: 190, gy: 90 }]; passed = 0; over = false; win = false; t = 0; };
    reset();
    const finish = val => { mgClose(timer); resolve(val); };
    MG.cancel = () => finish(false);
    MG.tap = () => { if (over) { if (win) finish(true); else reset(); return; } vy = -1.5; };
    MG.dbg = () => ({ y, passed, over, win });
    MG.forceWin = () => finish(true);
    const timer = setInterval(() => {
      if (!over) {
        t++;
        vy = Math.min(2.2, vy + 0.055); y += vy;
        const last = gates[gates.length - 1];
        if (last.x < 100) gates.push({ x: 190, gy: 34 + Math.random() * 120 });
        gates.forEach(gt => { gt.x -= 1.1; });
        gates = gates.filter(gt => { if (gt.x < -14) return false; return true; });
        for (const gt of gates) {
          if (!gt.done && gt.x < 36) { gt.done = true; passed++; sfx('tick'); if (passed >= target) { over = true; win = true; sfx('win'); } }
          if (gt.x > 22 && gt.x < 50 && (y < gt.gy - 26 || y > gt.gy + 26)) { over = true; win = false; sfx('miss'); }
        }
        if (y < 6 || y > 192) { over = true; win = false; sfx('miss'); }
      }
      // 그리기
      g.fillStyle = '#12203a'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#0d1830'; g.fillRect(0, 170, 160, 30);
      g.fillStyle = '#26406b'; for (let i = 0; i < 5; i++) g.fillRect((i * 40 + 200 - (t % 40)) % 200 - 20, 178 + (i % 2) * 8, 14, 4);
      for (const gt of gates) {
        g.fillStyle = '#7bd389';
        g.fillRect(gt.x - 3, 0, 6, gt.gy - 26);
        g.fillRect(gt.x - 3, gt.gy + 26, 6, 200 - gt.gy - 26);
        g.fillStyle = '#ffd166'; g.fillRect(gt.x - 5, gt.gy - 28, 10, 3); g.fillRect(gt.x - 5, gt.gy + 25, 10, 3);
      }
      // 드론
      g.fillStyle = '#d9d9de'; g.fillRect(30, y - 3, 12, 6);
      g.fillStyle = '#ff8fb1'; g.fillRect(33, y - 5, 6, 3);
      g.fillStyle = '#8a94a6'; g.fillRect(26, y - 6, 6, 2); g.fillRect(40, y - 6, 6, 2);
      $('mgInfo').textContent = over
        ? (win ? '비행 성공! 링 ' + passed + '개 통과!\n탭(Z)해서 계속' : '추락… 드론은 무사하다.\n탭(Z) 다시 · B(X) 그만')
        : '링 통과 ' + passed + '/' + target + '\n탭(또는 Z)하면 떠오른다 · B(X) 그만';
    }, 16);
  });
}

// 박자 맞추기: 움직이는 바늘이 금색 구간에 있을 때 탭. total번 시도, need번 성공하면 통과
function playRhythm(label, total, need) {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, tries, hits, zone, over, win, flash;
    const newZone = () => { zone = 24 + Math.random() * 112; };
    const reset = () => { tries = 0; hits = 0; over = false; win = false; flash = 0; newZone(); };
    reset();
    const finish = val => { mgClose(timer); resolve(val); };
    MG.cancel = () => finish(false);
    MG.dbg = () => ({ tries, hits, over, win });
    MG.forceWin = () => finish(true);
    const cursor = () => 80 + Math.sin(t / 22) * 68;
    MG.tap = () => {
      if (over) { if (win) finish(true); else reset(); return; }
      const c = cursor();
      const ok = Math.abs(c - zone) < 15;
      if (ok) hits++; flash = ok ? 8 : -8;
      sfx(ok ? 'hit' : 'miss');
      tries++;
      if (hits >= need) { over = true; win = true; sfx('win'); }
      else if (tries >= total) { over = true; win = hits >= need; }
      else newZone();
    };
    const timer = setInterval(() => {
      t++;
      if (!over && t % 32 === 0) sfx('tick');      // 박자를 잡아 주는 소리
      g.fillStyle = '#241a2e'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#f4f1ff'; g.font = '10px sans-serif'; g.textAlign = 'center';
      g.fillText(label, 80, 30);
      for (let i = 0; i < need; i++) { g.fillStyle = i < hits ? '#ffd166' : '#4a3f5a'; g.fillText('♪', 40 + i * 16, 56); }
      // 바
      g.fillStyle = '#3a3352'; g.fillRect(10, 110, 140, 14);
      g.fillStyle = '#ffd166'; g.fillRect(zone - 14, 108, 28, 18);
      const c = cursor();
      g.fillStyle = flash > 0 ? '#7bd389' : flash < 0 ? '#ef6f6c' : '#ffffff';
      if (flash > 0) flash--; if (flash < 0) flash++;
      g.fillRect(c - 2, 102, 4, 30);
      g.fillStyle = '#a79ec9'; g.fillText('금색 구간에서 탭!', 80, 150);
      $('mgInfo').textContent = over
        ? (win ? '완벽한 무대! (' + hits + '/' + need + ')\n탭(Z)해서 계속' : '아쉽다… (' + hits + '/' + need + ')\n탭(Z) 다시 · B(X) 그만')
        : label + ' — 성공 ' + hits + '/' + need + ' · 시도 ' + tries + '/' + total + '\n탭(또는 Z) · B(X) 그만';
    }, 16);
  });
}
// 시세 타이밍: 금색 구간에서 탭 = +5천만, 놓치면 -5천만. 누적 +2.5억이면 성공
function playPrice() {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, sum = 0, zone = 80, flash = 0, over = false, shots = 0;
    const newZone = () => { zone = 28 + Math.random() * 104; };
    newZone();
    const finish = val => { mgClose(timer); resolve(val); };
    MG.cancel = () => finish(false);
    MG.forceWin = () => finish(true);
    MG.dbg = () => ({ sum, shots, over });
    const cursor = () => 80 + Math.sin(t / 20) * 68;
    MG.tap = () => {
      if (over) { finish(true); return; }
      const ok = Math.abs(cursor() - zone) < 15;
      sum = Math.round((sum + (ok ? 0.5 : -0.5)) * 10) / 10;
      shots++; flash = ok ? 8 : -8;
      sfx(ok ? 'hit' : 'miss');
      if (sum >= 2.5) { over = true; sfx('win'); } else newZone();
    };
    const timer = setInterval(() => {
      t++;
      if (!over && t % 32 === 0) sfx('tick');      // 박자를 잡아 주는 소리
      g.fillStyle = '#1a2436'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#26406b';
      for (let i = 0; i < 8; i++) g.fillRect(10 + i * 18, 158 - i * 5 - Math.sin(t / 30 + i) * 4, 12, 44);
      g.fillStyle = '#f4f1ff'; g.font = '10px sans-serif'; g.textAlign = 'center';
      g.fillText('월곡 두산위브 실거래가', 80, 22);
      g.font = 'bold 18px sans-serif';
      g.fillStyle = sum >= 0 ? '#7bd389' : '#ef6f6c';
      g.fillText((sum >= 0 ? '+' : '') + sum.toFixed(1) + '억', 80, 50);
      g.fillStyle = '#3a3352'; g.fillRect(10, 108, 140, 14);
      g.fillStyle = '#ffd166'; g.fillRect(zone - 14, 106, 28, 18);
      const c = cursor();
      g.fillStyle = flash > 0 ? '#7bd389' : flash < 0 ? '#ef6f6c' : '#ffffff';
      if (flash > 0) flash--; if (flash < 0) flash++;
      g.fillRect(c - 2, 100, 4, 30);
      $('mgInfo').textContent = over
        ? '누적 +2.5억 달성! 계속 보유합니다\n탭(Z)해서 계속'
        : '금색에서 탭 = +5천만 / 놓치면 -5천만\n목표 +2.5억 · B(X) 그만';
    }, 16);
  });
}
// ===== 아주 쉬운 미니게임 (부모님도 3번 안에 성공) =====
//  공통 원칙
//   - 조작은 "화면 아무 데나 탭" 하나로 통일. 방향키는 보조.
//   - 지금 누르면 되는 상태는 금색으로 빛나고 소리가 난다.
//   - 읽어야 하는 글은 캔버스가 아니라 아래 안내줄(#mgInfo, DOM)에 크게 나온다.
//   - 실패해도 즉시 다시. 25초가 지나면 가족이 도와줘서 자동으로 끝난다.

// 공통: 첫 3초 손가락 안내 + 시간 초과 자동 종료
function mgGhost(g, t, kind) {
  if (t > 180) return;                       // 3초만
  const a = 0.55 + Math.sin(t / 8) * 0.25;
  g.globalAlpha = a;
  g.fillStyle = '#ffffff';
  if (kind === 'hold') { g.fillRect(74, 150, 12, 16); g.fillRect(70, 146, 20, 6); }
  else { g.beginPath(); g.arc(80, 158, 7, 0, 7); g.fill();
         g.strokeStyle = '#ffffff'; g.lineWidth = 1;
         g.beginPath(); g.arc(80, 158, 11 + (t % 30) * 0.4, 0, 7); g.stroke(); }
  g.globalAlpha = 1;
}

// ① 사진 찍기 (에펠탑) — 해가 나서 화면이 밝아졌을 때 탭. 4장 찍으면 끝.
function playPhoto(target) {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, shots = 0, good = 0, sunny = false, flash = 0, cool = 0, last = 0;
    const finish = () => { mgClose(timer); resolve(good); };
    MG.cancel = () => finish();
    MG.dbg = () => ({ shots, good, sunny });
    MG.forceWin = () => { good = target; shots = target; finish(); };
    MG.tap = () => {
      if (cool > 0 || shots >= target) return;
      cool = 20; shots++; flash = 10;
      if (sunny) { good++; sfx('hit'); } else sfx('miss');
      last = sunny ? 1 : -1;
      if (shots >= target) setTimeout(finish, 700);
    };
    const timer = setInterval(() => {
      t++; if (cool > 0) cool--;
      // 해가 4초 중 2.4초는 떠 있다(60%). 아주 넉넉하다.
      sunny = (t % 240) < 145;
      const sky = sunny ? '#8fc4ea' : '#6a7a8a';
      g.fillStyle = sky; g.fillRect(0, 0, 160, 200);
      if (sunny) { g.fillStyle = '#ffe9a3'; g.beginPath(); g.arc(132, 26, 12, 0, 7); g.fill(); }
      else { g.fillStyle = '#5a6a7a'; for (let i = 0; i < 5; i++) g.fillRect(10 + i * 30, 18 + (i % 2) * 8, 24, 8);
             g.fillStyle = '#8a9aaa'; for (let i = 0; i < 12; i++) g.fillRect((i * 37 + t) % 160, (i * 29 + t * 2) % 120, 1, 5); }
      // 에펠탑
      g.fillStyle = sunny ? '#9a7a50' : '#6a5a44';
      g.fillRect(74, 40, 12, 60); g.fillRect(70, 92, 20, 8); g.fillRect(62, 100, 36, 10);
      g.fillRect(66, 110, 6, 40); g.fillRect(88, 110, 6, 40); g.fillRect(78, 24, 4, 18);
      g.fillStyle = sunny ? '#7ab84a' : '#4a6a3a'; g.fillRect(0, 150, 160, 50);
      // 가족 4명
      const cols = ['#3d4a63', '#d96a8a', '#e9c44c', '#7bc4e0'];
      cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(28 + i * 26, 156, 12, 16);
        g.fillStyle = '#f7d3b3'; g.fillRect(30 + i * 26, 150, 8, 7); });
      if (sunny) { g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 157, 197); }
      if (flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (flash / 12) + ')'; g.fillRect(0, 0, 160, 200); flash--; }
      // 찍은 장수
      for (let i = 0; i < target; i++) { g.fillStyle = i < shots ? '#ffd166' : 'rgba(0,0,0,0.3)'; g.fillRect(8 + i * 12, 8, 9, 6); }
      mgGhost(g, t, 'tap');
      $('mgInfo').textContent = shots >= target
        ? '사진 ' + target + '장 완성! 잘 나온 사진 ' + good + '장'
        : (sunny ? '지금이에요! 화면을 톡 누르세요 ☀' : '구름이 지나가는 중… 해가 나면 누르세요')
          + '\n' + shots + ' / ' + target + '장' + (last === 1 ? '   방금 잘 나왔어요!' : last === -1 ? '   조금 어두웠어요' : '');
      if (t > 1560) { good = Math.max(good, 1); finish(); }
    }, 16);
  });
}

// ② 인파 헤치기 (루브르) — 화면을 계속 탭하면 앞으로 간다. 끝까지 가면 성공.
function playCrowd(target) {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, prog = 0, bump = 0, taps = 0;
    const finish = () => { mgClose(timer); resolve(Math.min(3, 1 + Math.floor(taps / 12))); };
    MG.cancel = () => finish();
    MG.dbg = () => ({ prog, taps });
    MG.forceWin = () => { prog = target; finish(); };
    MG.tap = () => { if (prog >= target) { finish(); return; } taps++; prog += 1.4; bump = 6; sfx('hit'); };
    MG.dir = () => { if (prog < target) { prog += 0.9; bump = 4; } };
    const timer = setInterval(() => {
      t++;
      if (prog > 0) prog -= 0.06;                       // 아주 조금만 밀린다
      if (prog >= target) { g.fillStyle = '#2a2a33'; }
      g.fillStyle = '#3a3a44'; g.fillRect(0, 0, 160, 200);
      // 모나리자 (위쪽)
      const near = Math.min(1, prog / target);
      const fw = 26 + near * 40, fh = 34 + near * 52;
      g.fillStyle = '#7a5a2a'; g.fillRect(80 - fw / 2, 20 - near * 6, fw, fh);
      g.fillStyle = '#3a3a2a'; g.fillRect(80 - fw / 2 + 3, 23 - near * 6, fw - 6, fh - 6);
      g.fillStyle = '#e0b48a'; g.fillRect(80 - fw / 8, 30 - near * 4, fw / 4, fh / 4);
      // 인파 (뒤로 밀려남)
      for (let i = 0; i < 16; i++) {
        const y = 190 - ((i * 23 + prog * 9) % 150);
        if (y < 60) continue;
        const x = 12 + ((i * 47) % 130);
        g.fillStyle = ['#5a5a64', '#6a6a74', '#4a4a54'][i % 3];
        g.fillRect(x + (bump ? (i % 2 ? 1 : -1) : 0), y, 13, 17);
        g.fillStyle = '#c9a58a'; g.fillRect(x + 3, y - 6, 8, 7);
      }
      if (bump > 0) bump--;
      // 나(현지)
      g.fillStyle = '#7bc4e0'; g.fillRect(74, 172, 13, 17);
      g.fillStyle = '#f7d3b3'; g.fillRect(77, 165, 8, 7);
      // 진행 막대
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(10, 194, 140, 5);
      g.fillStyle = '#ffd166'; g.fillRect(10, 194, 140 * near, 5);
      if (prog < target) { g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 157, 197); }
      mgGhost(g, t, 'tap');
      $('mgInfo').textContent = prog >= target
        ? '드디어 모나리자 앞!\n화면을 눌러 계속'
        : '화면을 계속 톡톡 누르세요\n사람들 사이를 헤치고 앞으로';
      if (prog >= target && t % 30 < 15) { g.fillStyle = 'rgba(255,209,102,0.25)'; g.fillRect(0, 0, 160, 200); }
      if (t > 1560) finish();
    }, 16);
  });
}

// ③ 꼬마열차 (베르사유) — 누르고 있으면 달리고 떼면 선다. 역에서 멈추면 만점.
function playTrain(stops) {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, x = 0, held = false, done = 0, good = 0, msg = '';
    const stopAt = [];
    for (let i = 1; i <= stops; i++) stopAt.push(i * (300 / (stops + 0.2)));
    const finish = () => { mgClose(timer); resolve(good); };
    MG.cancel = () => finish();
    MG.dbg = () => ({ x: Math.round(x), done, good });
    MG.forceWin = () => { good = stops; done = stops; finish(); };
    MG.hold = v => { held = v; };
    MG.tap = () => { if (done >= stops) finish(); };
    const timer = setInterval(() => {
      t++;
      if (done < stops) { if (held) x += 1.5; }
      const next = stopAt[done];
      const near = next !== undefined && Math.abs(x - next) < 22;   // 아주 넓은 정차 구간
      if (next !== undefined && !held && Math.abs(x - next) < 22) {
        done++; good++; msg = '정확히 섰어요!'; sfx('hit');
        if (done >= stops) setTimeout(finish, 800);
      } else if (next !== undefined && x > next + 22) {
        done++; msg = '조금 지나쳤어요'; sfx('miss');
        if (done >= stops) setTimeout(finish, 800);
      }
      g.fillStyle = '#8fc4ea'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#7ab84a'; g.fillRect(0, 120, 160, 80);
      g.fillStyle = '#e8dcc0'; g.fillRect(0, 96, 160, 24);
      // 정차역 표시
      stopAt.forEach((sx, i) => {
        const px = 20 + (sx - x) * 0.9;
        if (px < -20 || px > 180) return;
        g.fillStyle = i < done ? '#7bd389' : (near && i === done ? '#ffd166' : '#c94b4b');
        g.fillRect(px, 78, 4, 20); g.fillRect(px - 5, 72, 14, 8);
      });
      // 열차
      g.fillStyle = '#c94b4b'; g.fillRect(14, 100, 26, 16);
      g.fillStyle = '#f0d878'; g.fillRect(40, 102, 20, 14); g.fillRect(62, 102, 20, 14);
      g.fillStyle = '#9fd0ea'; g.fillRect(44, 105, 5, 6); g.fillRect(52, 105, 5, 6); g.fillRect(66, 105, 5, 6); g.fillRect(74, 105, 5, 6);
      g.fillStyle = '#2a2a33';
      [20, 34, 46, 56, 68, 78].forEach(wx => g.fillRect(wx, 114, 5, 5));
      if (held) { g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(6, 96, 6, 20); }
      if (near) { g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 157, 197); if (t % 20 === 0) sfx('tick'); }
      for (let i = 0; i < done; i++) { g.fillStyle = '#ffd166'; g.fillRect(8 + i * 10, 8, 7, 7); }
      mgGhost(g, t, 'hold');
      $('mgInfo').textContent = done >= stops
        ? '도착! 정차 성공 ' + good + '번\n화면을 눌러 계속'
        : (near ? '지금 손을 떼세요! 🚋' : '화면을 꾹 누르고 계세요\n빨간 팻말이 보이면 손을 떼면 정차')
          + '\n' + done + ' / ' + stops + '역' + (msg ? '   ' + msg : '');
      if (t > 1560) { good = Math.max(good, 1); finish(); }
    }, 16);
  });
}

// ④ 골라잡기 (기차역·스위스 길찾기 공용) — 세 개 중 하나를 탭. 정답은 화면에 그려져 있다.
//    옵션은 [{icon, label, ok}] 형태. 색·기호로 구분되므로 글을 못 읽어도 고를 수 있다.
function playPick(title, opts, hintText) {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, cur = 0, picked = -1;
    const finish = () => { mgClose(timer); resolve(picked); };
    MG.cancel = () => finish();
    MG.dbg = () => ({ cur, picked });
    MG.forceWin = () => { picked = opts.findIndex(o => o.ok); if (picked < 0) picked = 0; finish(); };
    MG.dir = d => { if (picked >= 0) return; if (d === 'left') cur = (cur + opts.length - 1) % opts.length; else if (d === 'right') cur = (cur + 1) % opts.length; };
    MG.tap = e => {
      if (picked >= 0) { finish(); return; }
      if (e && e.clientX !== undefined) {
        const r = $('mgCv').getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width * 160, py = (e.clientY - r.top) / r.height * 200;
        for (let i = 0; i < opts.length; i++) {
          const bx = 12, by = 58 + i * 44;
          if (px >= bx && px <= 148 && py >= by && py <= by + 38) { cur = i; break; }
        }
        if (py < 50) return;
      }
      picked = cur; sfx(opts[cur].ok ? 'win' : 'hit');
      setTimeout(finish, 900);
    };
    const timer = setInterval(() => {
      t++;
      g.fillStyle = '#243044'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#f4f1ff'; g.font = 'bold 11px sans-serif'; g.textAlign = 'center';
      g.fillText(title, 80, 26);
      opts.forEach((o, i) => {
        const by = 58 + i * 44, on = i === cur, chosen = picked === i;
        g.fillStyle = chosen ? (o.ok ? '#2f6f4f' : '#5a4a4a') : on ? '#3a4a64' : '#2e3a4e';
        g.fillRect(12, by, 136, 38);
        g.strokeStyle = chosen ? '#ffffff' : on ? '#ffd166' : '#4a5a70';
        g.lineWidth = on || chosen ? 3 : 1;
        g.strokeRect(12.5, by + 0.5, 135, 37);
        if (o.draw) o.draw(g, 22, by + 6);
        g.fillStyle = '#f4f1ff'; g.font = '11px sans-serif'; g.textAlign = 'left';
        g.fillText(o.icon || '', 24, by + 24);
        g.textAlign = 'center';
      });
      mgGhost(g, t, 'tap');
      $('mgInfo').textContent = picked >= 0
        ? (opts[picked].ok ? '맞았어요!' : '괜찮아요, 그것도 방법이죠')
        : (hintText || '셋 중 하나를 골라 누르세요') + '\n(방향키로 옮기고 A로 골라도 됩니다)';
      if (t > 1560 && picked < 0) { picked = cur; finish(); }
    }, 16);
  });
}

// ⑤ 라면 익히기 (융프라우) — 면이 노랗게 익으면 탭. 아주 넉넉한 구간.
function playRamen() {
  return new Promise(resolve => {
    const g = mgOpen();
    let t = 0, done = false, grade = 0;
    const finish = () => { mgClose(timer); resolve(grade); };
    MG.cancel = () => finish();
    MG.dbg = () => ({ t, grade, done });
    MG.forceWin = () => { grade = 2; done = true; finish(); };
    MG.tap = () => {
      if (done) { finish(); return; }
      done = true;
      const k = t % 300;
      grade = k < 90 ? 1 : k < 230 ? 2 : 3;    // 꼬들 / 딱 좋음 / 퍼짐 — 전부 통과
      sfx(grade === 2 ? 'win' : 'hit');
      setTimeout(finish, 900);
    };
    const timer = setInterval(() => {
      t++;
      const k = t % 300, ready = k >= 90 && k < 230;
      g.fillStyle = '#243044'; g.fillRect(0, 0, 160, 200);
      g.fillStyle = '#c9c9d2'; g.fillRect(0, 150, 160, 50);
      // 컵라면 4개 (식구 4명)
      for (let i = 0; i < 4; i++) {
        const x = 14 + i * 36;
        g.fillStyle = '#e8e0d0'; g.fillRect(x, 96, 28, 40);
        g.fillStyle = '#c94b4b'; g.fillRect(x, 96, 28, 8);
        const cook = Math.min(1, k / 230);
        g.fillStyle = ready ? '#ffd166' : (k < 90 ? '#f0e4b0' : '#d8b070');
        g.fillRect(x + 4, 108 + (1 - cook) * 8, 20, 12 + cook * 8);
        // 김
        g.fillStyle = 'rgba(255,255,255,0.35)';
        for (let s = 0; s < 3; s++) g.fillRect(x + 8 + s * 6, 86 - ((t / 3 + s * 9) % 22), 2, 5);
      }
      if (ready) { g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 157, 197); if (t % 24 === 0) sfx('tick'); }
      // 익음 막대
      g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(14, 176, 132, 8);
      g.fillStyle = '#ffd166'; g.fillRect(14 + 132 * (90 / 300), 176, 132 * (140 / 300), 8);
      g.fillStyle = '#ffffff'; g.fillRect(14 + 132 * (k / 300), 173, 3, 14);
      mgGhost(g, t, 'tap');
      $('mgInfo').textContent = done
        ? ['', '꼬들꼬들! 아빠 취향', '딱 좋게 익었어요!', '푹 퍼졌네요. 엄마 취향'][grade]
        : (ready ? '지금이에요! 화면을 누르세요 🍜' : '조금만 더 기다리세요…\n노란 구간에 오면 누르면 돼요');
      if (t > 1560 && !done) { grade = 2; done = true; finish(); }
    }, 16);
  });
}

// 미니게임 입력: 탭 + 누르고 있기(꼬마열차용)
$('mg').addEventListener('pointerdown', e => { e.preventDefault(); if (MG.hold) MG.hold(true); if (MG.tap) MG.tap(e); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  $('mg').addEventListener(ev, () => { if (MG.hold) MG.hold(false); }));

// ----- HUD·저장·화면 -----
function setHud() {
  $('hudName').textContent = S.ch ? CH[S.ch].title : '—';
  $('hudGoal').textContent = !quest ? '' : (S.q.finished ? '장면 완료!' : quest.goal(S.q));
}
function save() {

function chapterState(i) {

//   코드는 게임 비밀번호와 같다(PASSWORD). 눈에 잘 띄지 않게 흐리게 두었다.
function restoreAll() {
  const box = $('restoreBox'), val = ($('restoreIn').value || '').trim();
  box.classList.remove('ok', 'bad');

  S.done = {}; CHAPTERS.forEach(c => { S.done[c.id] = true; });

  store.set('eu_rewards', REWARDS.map(r => r.id));
  S.ch = null; S.map = null; S.q = {}; quest = null;
  save(); box.classList.add('ok'); $('restoreIn').value = '';
  toast('모든 진행을 복구했습니다');
  buildRoster();
}

// ----- 비밀번호 잠금 -----
function buildPad(el, onKey) {
  el.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','','0','←'].forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = k;
    if (k === '') b.style.visibility = 'hidden';
    else b.addEventListener('click', () => onKey(k));
    el.appendChild(b);
  });
}
let lockBuf = '';
function lockDraw() { [...$('lockDots').children].forEach((d, i) => d.classList.toggle('on', i < lockBuf.length)); }
function lockKey(k) {
  const dots = $('lockDots'); dots.classList.remove('bad');
  if (k === '←') { lockBuf = lockBuf.slice(0, -1); lockDraw(); return; }
  if (lockBuf.length >= 4) return;
  lockBuf += k; lockDraw();
  if (lockBuf.length === 4) {
    if (lockBuf === PASSWORD) { setTimeout(() => showTitle(), 200); }
    else { void dots.offsetWidth; dots.classList.add('bad'); toastLock(); setTimeout(() => { lockBuf = ''; lockDraw(); }, 450); }
  }
}
function toastLock() { const t = $('toast'); t.textContent = '앗, 다시 한 번!'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }

function boot() {
  fit();
  const c = $('titleCv'), g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  FRIENDS.forEach((f, i) => g.drawImage(SPRITES[f.id].down[0], 6 + i * 20, 8));
  buildPad($('lockPad'), lockKey);
  // 들어올 때마다 비밀번호를 묻는다(해제 상태를 기기에 남기지 않는다).
  store.del('eu_unlock');
  showScreen('lock');
  requestAnimationFrame(loop);
}

// ----- 배경음악: 첫 터치/키 입력 뒤에 재생(브라우저 정책), 오른쪽 위 버튼으로 켜고 끔 -----
const BGM_LIST = ['bgm1.mp3', 'bgm2.mp3'];   // 1: 평화로운 피아노 브금, 2: A hisa - Dreamin'
const bgm = new Audio();
bgm.volume = 0.35; bgm.preload = 'auto';
let bgmIdx = 0, bgmOn = store.get('eu_bgm', true), bgmStarted = false;
bgm.src = BGM_LIST[0];
bgm.addEventListener('ended', () => { bgmIdx = (bgmIdx + 1) % BGM_LIST.length; bgm.src = BGM_LIST[bgmIdx]; bgmPlay(); });
// ----- 효과음: 타이밍 게임용. 음원 파일 없이 웹오디오로 만든다.
//   함수 선언이라 위쪽 미니게임에서도 부를 수 있고, 실제 호출은 부팅 뒤라 bgmOn 이 이미 정해져 있다.
let sfxCtx = null;
function sfxTone(t0, freq, freq2, type, vol, dur) {
  const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
  o.connect(g); g.connect(sfxCtx.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur * 0.7);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (!bgmOn) return;                       // 소리를 끈 상태면 효과음도 내지 않는다
  try {
    if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sfxCtx.state === 'suspended') sfxCtx.resume();
    const t = sfxCtx.currentTime;
    if (kind === 'hit') sfxTone(t, 880, 1320, 'triangle', 0.16, 0.16);
    else if (kind === 'miss') sfxTone(t, 190, 90, 'sawtooth', 0.13, 0.20);
    else if (kind === 'tick') sfxTone(t, 1250, 0, 'square', 0.04, 0.04);
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => sfxTone(t + i * 0.09, f, 0, 'triangle', 0.15, 0.22));
  } catch (e) { /* 소리가 안 나도 게임은 그대로 돌아간다 */ }
}

function bgmBtn() { $('btnBgm').textContent = bgmOn ? '🔊' : '🔇'; }
bgm.addEventListener('playing', () => { bgmStarted = true; });
function bgmPlay() { if (!bgmOn) return; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }
// 브라우저는 사용자 조작 중에만 첫 재생을 허용한다. 그런데 음원이 아직 안 받아졌거나
// 조작이 인정되지 않으면 조용히 실패한다. 한 번 실패하고 포기하면 "껐다 켜야 소리가 난다".
// 그래서 실제로 소리가 날 때까지, 조작이 있을 때마다 계속 다시 시도한다.
function bgmNudge() {
  if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume();   // 효과음 쪽도 같이 깨운다
  if (!bgmOn || !bgm.paused) return;
  bgmPlay();
}
['pointerdown', 'pointerup', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, bgmNudge, true));
$('btnBgm').addEventListener('click', e => {
  e.stopPropagation();
  bgmOn = !bgmOn; store.set('eu_bgm', bgmOn); bgmBtn();
  if (bgmOn) bgmPlay(); else bgm.pause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else if (bgmOn && bgmStarted) bgmPlay(); });
bgmBtn();

const REWARDS = [
  { id: 'eiffel', ch: 'c1', name: '비 갠 에펠탑', kind: 'photo', icon: '🗼' },
  { id: 'louvre', ch: 'c2', name: '루브르에서', kind: 'photo', icon: '🖼' },

function rewardsOwned() { return store.get('eu_rewards', []); }
function grantReward(chId) {

function drawTicket(g) {
  g.fillStyle = '#f4f8ff'; g.fillRect(0, 0, 160, 110);
  g.strokeStyle = '#2f5a8a'; g.setLineDash([4, 3]); g.strokeRect(4.5, 4.5, 151, 101); g.setLineDash([]);
  g.fillStyle = '#2f5a8a'; g.fillRect(0, 0, 160, 26);
  g.fillStyle = '#ffffff'; g.font = 'bold 11px sans-serif'; g.textAlign = 'center';
  g.fillText('BOARDING PASS', 80, 17);
  g.fillStyle = '#22304a'; g.font = 'bold 13px sans-serif';
  g.fillText('ZRH  →  ICN', 80, 50);
  g.font = '10px sans-serif';
  g.fillText('SEOL x 4    GATE A7', 80, 70);
  g.fillText('우리가족 유럽여행', 80, 90);
}
// 사진 키 → 표시 가능한 src (.bin 복호 → jpg → 없음)
async function resolvePhotoSrc(key) {
  try {
    const res = await fetch('photos/' + key + '.bin');
    if (res.ok) {
      const buf = new Uint8Array(await res.arrayBuffer());
      const k2 = (PASSWORD + PASSWORD).split('').map(ch => ch.charCodeAt(0));
      for (let i = 0; i < buf.length; i++) buf[i] ^= k2[i % k2.length] ^ ((i * 7) & 0xff);
      return URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    }
  } catch (e) { /* 다음 */ }
  for (const ext of ['jpg', 'png']) {
    const ok = await new Promise(r => { const im = new Image(); im.onload = () => r(true); im.onerror = () => r(false); im.src = 'photos/' + key + '.' + ext; });
    if (ok) return 'photos/' + key + '.' + ext;
  }
  return null;
}
let viewerOpen = false;
async function viewReward(r) {
  const ph = $('photo'), img = $('photoImg'), cap = $('photoCap');
  let src = null;
  if (r.kind === 'draw') {
    const c = document.createElement('canvas'); c.width = 320; c.height = 220;
    const g = c.getContext('2d'); g.scale(2, 2); drawTicket(g);
    src = c.toDataURL();
  } else src = await resolvePhotoSrc(r.id);
  img.style.display = src ? '' : 'none'; if (src) img.src = src;
  cap.textContent = r.name + (src ? '' : '\n(사진이 아직 준비되지 않았어요)') + '\n— 탭하면 닫혀요 —';
  viewerOpen = true;
  ph.classList.add('on'); void ph.offsetWidth; ph.classList.add('show');
}
$('photo').addEventListener('pointerdown', () => {
  if (!viewerOpen) return;
  viewerOpen = false;
  const ph = $('photo'); ph.classList.remove('show');
  setTimeout(() => ph.classList.remove('on'), 380);
});
function buildGift() {
  const grid = $('giftGrid'); grid.innerHTML = '';
  const owned = rewardsOwned();
  REWARDS.forEach(r => {
    const b = document.createElement('button'); b.type = 'button';
    const has = owned.includes(r.id);
    const gi = document.createElement('span'); gi.className = 'gi'; gi.textContent = has ? r.icon : '🔒';
    const nm = document.createElement('span'); nm.textContent = has ? r.name : (CH[r.ch] ? CH[r.ch].title : '') + ' 보상';
    b.append(gi, nm);
    if (has) { b.classList.add('own'); b.addEventListener('click', () => viewReward(r)); }
    else b.disabled = true;
    grid.appendChild(b);
  });
}
$('btnGift').addEventListener('click', () => { buildGift(); showScreen('gift'); });
