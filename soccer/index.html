<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>반대항축구</title>
<style>
  :root {
    --bg: #0d1710;
    --pitch: #3f9a4a;
    --pitch-2: #3a9044;
    --line: rgba(255, 255, 255, 0.85);
    --net: rgba(255, 255, 255, 0.35);
    --team-a: #3b82f6;
    --team-b: #ef4444;
    --team-a-dark: #1d4ed8;
    --team-b-dark: #b91c1c;
    --keeper: #facc15;
    --keeper-dark: #a16207;
    --ball: #f8fafc;
    --ball-mark: #1f2937;
    --shadow: rgba(0, 0, 0, 0.3);
    --stun: #fde047;
    --charge: #fb923c;
    --curve: #a78bfa;
    --ult: #f472b6;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --hud-bg: rgba(15, 23, 42, 0.72);
    --accent: #22c55e;
    --danger: #ef4444;
    --btn: rgba(255, 255, 255, 0.14);
    --btn-border: rgba(255, 255, 255, 0.38);
    --btn-on: rgba(34, 197, 94, 0.5);
    --btn-ult: rgba(244, 114, 182, 0.28);
    --stick: rgba(255, 255, 255, 0.16);
    --stick-knob: rgba(255, 255, 255, 0.5);
    --map-bg: rgba(10, 20, 12, 0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Pretendard, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
    background: var(--hud-bg); padding: 5px 14px; border-radius: 10px; font-size: 17px; font-weight: 600; pointer-events: none; white-space: nowrap; z-index: 2; }
  .hud .score { font-size: 24px; letter-spacing: 1px; }
  .hud .a { color: var(--team-a); } .hud .b { color: var(--team-b); }
  .hud .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  #ultBar { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: 230px; pointer-events: none; z-index: 2; }
  #ultBar .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  #ultBar .track { height: 10px; border-radius: 5px; background: var(--hud-bg); overflow: hidden; border: 1px solid rgba(255,255,255,0.14); }
  #ultBar .fill { height: 100%; width: 0%; background: var(--ult); transition: width .1s linear; }
  #ultBar.ready .fill { background: var(--accent); }
  #ultBar.ready .lbl { color: var(--accent); }
  #ultBar.on .fill { background: var(--stun); }
  #banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(0.9); font-size: 52px; font-weight: 800;
    text-shadow: 0 4px 18px rgba(0,0,0,0.65); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; white-space: nowrap; z-index: 2; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #help { position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 12.5px; color: var(--muted); background: var(--hud-bg);
    padding: 6px 10px; border-radius: 8px; line-height: 1.55; pointer-events: none; z-index: 2; }
  #help b { color: var(--text); font-weight: 600; }
  #debug { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top)); font: 12px/1.45 Consolas, 'Courier New', monospace; color: var(--text);
    background: var(--hud-bg); padding: 6px 10px; border-radius: 8px; white-space: pre; display: none; pointer-events: none; z-index: 3; }
  #debug.show { display: block; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 5; }
  #overlay.show { display: flex; }
  .panel { background: var(--hud-bg); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 20px 26px; text-align: center; max-width: 94vw; max-height: 94vh; overflow: auto; }
  .panel h1 { margin: 0 0 4px; font-size: 30px; }
  .panel .sub { color: var(--muted); margin-bottom: 12px; font-size: 13.5px; }
  .panel .chars { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }
  .panel .chars button { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.18);
    background: transparent; color: var(--muted); cursor: pointer; }
  .panel .chars button.sel { border-color: var(--accent); color: var(--text); background: rgba(34,197,94,0.16); }
  .panel .ultinfo { font-size: 13px; color: var(--muted); min-height: 20px; margin-bottom: 12px; }
  .panel .ultinfo b { color: var(--ult); }
  .panel .final { font-size: 36px; font-weight: 800; margin: 6px 0 12px; }
  .panel .hint { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.6; }
  .panel kbd { display: inline-block; padding: 1px 6px; border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; font: 12.5px Consolas, monospace; color: var(--text); }
  .panel button.start { font: inherit; font-size: 18px; font-weight: 700; color: var(--text); background: var(--accent); border: 0; border-radius: 10px; padding: 11px 34px; cursor: pointer; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 18px; }

  /* ── 터치 조작 ── */
  #touch { position: fixed; inset: 0; display: none; z-index: 3; }
  #touch.show { display: block; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 42%; height: 72%; }
  #stick { position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: var(--stick); display: none; pointer-events: none; }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--stick-knob); }
  #stick.show { display: block; }
  .tbtn { position: absolute; border-radius: 50%; background: var(--btn); border: 2px solid var(--btn-border); color: var(--text);
    font-weight: 700; display: flex; align-items: center; justify-content: center; touch-action: none; text-align: center; line-height: 1.1; }
  .tbtn.on { background: var(--btn-on); }
  #bKick    { right: calc(24px + env(safe-area-inset-right));  bottom: calc(96px + env(safe-area-inset-bottom)); width: 88px; height: 88px; font-size: 17px; }
  #bDribble { right: calc(120px + env(safe-area-inset-right)); bottom: calc(152px + env(safe-area-inset-bottom)); width: 66px; height: 66px; font-size: 14px; }
  #bPass    { right: calc(120px + env(safe-area-inset-right)); bottom: calc(62px + env(safe-area-inset-bottom));  width: 66px; height: 66px; font-size: 14px; }
  #bBack    { right: calc(34px + env(safe-area-inset-right));  bottom: calc(16px + env(safe-area-inset-bottom));  width: 66px; height: 66px; font-size: 14px; }
  #bCurveL  { right: calc(200px + env(safe-area-inset-right)); bottom: calc(120px + env(safe-area-inset-bottom)); width: 58px; height: 58px; font-size: 13px; }
  #bCurveR  { right: calc(200px + env(safe-area-inset-right)); bottom: calc(46px + env(safe-area-inset-bottom));  width: 58px; height: 58px; font-size: 13px; }
  #bUlt     { left: calc(18px + env(safe-area-inset-left));    bottom: calc(124px + env(safe-area-inset-bottom)); width: 62px; height: 62px; font-size: 13px;
              background: var(--btn-ult); border-color: var(--ult); opacity: .45; }
  #bUlt.ready { opacity: 1; border-color: var(--accent); box-shadow: 0 0 14px rgba(34,197,94,0.5); }
  #rotateHint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--hud-bg);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); display: none; pointer-events: none; white-space: nowrap; z-index: 4; }
  @media (orientation: portrait) { body.touch #rotateHint { display: block; } }
  @media (max-width: 760px) {
    .hud { font-size: 13px; padding: 3px 9px; gap: 7px; } .hud .score { font-size: 19px; }
    #banner { font-size: 34px; }
    #ultBar { width: 150px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    .panel h1 { font-size: 23px; } .panel .chars button { padding: 6px 8px; font-size: 12px; }
  }
  body.touch #help { display: none; }
  /* 터치에서는 화면 아래 가운데(조이스틱과 버튼 사이 빈 곳)에 둔다 — 우상단은 미니맵 자리라 겹친다 */
  body.touch #ultBar { width: 150px; bottom: calc(8px + env(safe-area-inset-bottom)); }
  body.touch #ultBar .lbl { font-size: 11px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><span class="a" id="nameA">1반</span><span class="score" id="score">0 : 0</span><span class="b" id="nameB">2반</span><span class="clock" id="clock">전반 02:30</span></div>
<div id="ultBar"><div class="lbl"><span id="ultName">필살기</span><span id="ultPct">0%</span></div><div class="track"><div class="fill" id="ultFill"></div></div></div>
<div id="banner"></div>
<div id="help">
  <b>이동</b> 방향키 · <b>드리블</b> W(꾹 = 계속 참) · <b>슛·발차기</b> D(길게 = 강하게) · <b>뒷발차기</b> S<br>
  <b>감아차기</b> Q(왼쪽)·E(오른쪽), 꾹 누를수록 많이 휨 · <b>패스</b> Z · <b>필살기</b> A · <b>디버그</b> F3
</div>
<div id="debug"></div>
<div id="touch">
  <div id="stickZone"><div id="stick"><div class="knob"></div></div></div>
  <div class="tbtn" id="bKick" data-key="KeyD">슛<br>발차기</div>
  <div class="tbtn" id="bDribble" data-key="KeyW">드리블</div>
  <div class="tbtn" id="bPass" data-key="KeyZ">패스</div>
  <div class="tbtn" id="bBack" data-key="KeyS">뒷발</div>
  <div class="tbtn" id="bCurveL" data-key="KeyQ">감아◀</div>
  <div class="tbtn" id="bCurveR" data-key="KeyE">감아▶</div>
  <div class="tbtn" id="bUlt" data-key="KeyA">필살</div>
</div>
<div id="rotateHint">가로로 돌리면 경기장이 더 잘 보입니다</div>
<div id="overlay">
  <div class="panel">
    <h1>반대항축구</h1>
    <div class="sub" id="ovSub">연습장 — 골키퍼는 자동, 상대는 허수아비. 캐릭터를 고르고 시작하세요.</div>
    <div class="final" id="ovFinal" style="display:none"></div>
    <div class="chars" id="ovChars"></div>
    <div class="ultinfo" id="ovUlt"></div>
    <button class="start" id="ovStart">시작</button>
    <div class="hint" id="ovHint"></div>
  </div>
</div>
<div id="nogl">이 브라우저는 캔버스를 지원하지 않아 게임을 실행할 수 없습니다. 최신 크롬 또는 엣지를 사용해 주세요.</div>

<script src="game-core.js"></script>
<script src="sprites.js"></script>
<script>
(function () {
  'use strict';
  var core = window.SoccerCore;
  var C = core.C, BTN = core.BTN, ST = core.ST, PHASE = core.PHASE, MOTION_NAME = core.MOTION_NAME;
  var TAU = Math.PI * 2;
  var sprite = window.SoccerSprite || null;   // sprites.js 가 있으면 그림을 그쪽에 맡긴다

  // ── store: localStorage 를 try/catch 로 감싼다 (file://·쿠키 차단 환경 대비) ──
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var SETTINGS_KEY = 'soc_settings';
  var settings = { interpMs: 100, char: 0, minimap: true };
  try {
    var saved = JSON.parse(store.get(SETTINGS_KEY) || '{}');
    if (saved && typeof saved === 'object') {
      if (saved.interpMs >= 50 && saved.interpMs <= 150) settings.interpMs = saved.interpMs;
      if (saved.char >= 0 && saved.char < 6) settings.char = saved.char | 0;
      if (typeof saved.minimap === 'boolean') settings.minimap = saved.minimap;
    }
  } catch (e) {}
  function saveSettings() { store.set(SETTINGS_KEY, JSON.stringify(settings)); }

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('game');
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx) { $('nogl').style.display = 'flex'; return; }
  var params = new URLSearchParams(location.search);
  var debugOn = params.get('debug') === '1';
  $('debug').classList.toggle('show', debugOn);

  // 색은 :root 변수에서 읽는다
  var cs = getComputedStyle(document.documentElement);
  function cssVar(n) { return cs.getPropertyValue(n).trim(); }
  var COLOR = {
    bg: cssVar('--bg'), pitch: cssVar('--pitch'), pitch2: cssVar('--pitch-2'), line: cssVar('--line'), net: cssVar('--net'),
    team: [cssVar('--team-a'), cssVar('--team-b')], teamDark: [cssVar('--team-a-dark'), cssVar('--team-b-dark')],
    keeper: cssVar('--keeper'), keeperDark: cssVar('--keeper-dark'),
    ball: cssVar('--ball'), ballMark: cssVar('--ball-mark'), shadow: cssVar('--shadow'),
    stun: cssVar('--stun'), charge: cssVar('--charge'), curve: cssVar('--curve'), ult: cssVar('--ult'),
    text: cssVar('--text'), muted: cssVar('--muted'), mapBg: cssVar('--map-bg')
  };
  var TEAM_NAMES = ['1반', '2반'];

  // ── 뷰포트 + RPG 카메라 ──────────────────────────────────────────────────
  // 시야는 "보이는 월드 **넓이**"로 고정한다 — 화면이 커도 더 많이 보이지 않아야 온라인에서 공평하다.
  // 세로만 고정하면 화면비가 극단일 때 무너진다(세로 폰은 가로 138단위만 보이고, 32:9는 경기장 75%가 보인다).
  var VIEW_AREA_PC = 230400;    // 16:9 에서 정확히 640×360
  var VIEW_AREA_TOUCH = 195000; // 812×375 에서 정확히 650×300 (폰은 화면이 작아 조금 덜 본다)
  var VIEW_W_MAX = 880;         // 이 이상 보이면 "전체 맵"이 되어 좁은 시야의 의미가 사라진다
  var VIEW_W_MIN = 300;         // 세로 폰 대비 하한 (선수 지름 28 기준 약 10명 폭)
  var VIEW_H_MIN = 288;         // 골대 폭 200 + 위아래 여유 44씩 — 골 앞에서 두 기둥이 같이 보이는 하한
  var view = { scale: 1, dpr: 1, w: 0, h: 0, cssW: 0, cssH: 0, worldW: 0, worldH: 0 };
  var cam = { x: C.FIELD_W / 2, y: C.FIELD_H / 2, init: false };
  var CAM = { deadX: 46, deadY: 34, tau: 0.10 };   // 데드존(월드 단위)과 추종 시상수(초)

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    view.dpr = dpr; view.w = canvas.width; view.h = canvas.height; view.cssW = w; view.cssH = h;
    var cw = canvas.width, chh = canvas.height;
    var area = touchOn ? VIEW_AREA_TOUCH : VIEW_AREA_PC;
    var sc = Math.sqrt(cw * chh / area);                              // 넓이 고정
    var sMax = Math.min(cw / VIEW_W_MIN, chh / VIEW_H_MIN);           // 더 크면 너무 조금 보인다
    var sMin = cw / VIEW_W_MAX;                                       // 더 작으면 너무 많이 보인다(공평성)
    sc = sMin > sMax ? sMin : clamp(sc, sMin, sMax);                  // 충돌하면 공평성 우선
    view.scale = Math.max(0.02, sc);                                  // 크기 0인 캔버스 방어
    view.worldW = cw / view.scale;
    view.worldH = chh / view.scale;
  }
  window.addEventListener('resize', resize);

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  // 카메라는 클라이언트 전용이다 — 시뮬레이션 결정성과 무관하다.
  function updateCamera(dt) {
    var tx = cam.x, ty = cam.y;
    var me = myRenderPlayer();
    if (me) {
      if (me.x > cam.x + CAM.deadX) tx = me.x - CAM.deadX;
      else if (me.x < cam.x - CAM.deadX) tx = me.x + CAM.deadX;
      if (me.y > cam.y + CAM.deadY) ty = me.y - CAM.deadY;
      else if (me.y < cam.y - CAM.deadY) ty = me.y + CAM.deadY;
      if (!cam.init) { tx = me.x; ty = me.y; cam.init = true; }
    } else if (rs.has) { tx = rs.ball.x; ty = rs.ball.y; }
    var k = 1 - Math.exp(-Math.max(0.001, dt) / CAM.tau);   // 프레임률과 무관한 부드러운 추종
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
    // 경기장(골망 포함) 밖이 보이지 않게 클램프. 화면이 경기장보다 크면 가운데 고정.
    var hw = view.worldW / 2, hh = view.worldH / 2, D = C.GOAL_DEPTH;
    var minX = -D + hw, maxX = C.FIELD_W + D - hw;
    var minY = hh, maxY = C.FIELD_H - hh;
    cam.x = minX > maxX ? C.FIELD_W / 2 : clamp(cam.x, minX, maxX);
    cam.y = minY > maxY ? C.FIELD_H / 2 : clamp(cam.y, minY, maxY);
  }
  function px(x) { return (x - cam.x) * view.scale + view.w / 2; }
  function py(y) { return (y - cam.y) * view.scale + view.h / 2; }

  // ── 키보드 입력 → 통일된 입력 상태 (CLAUDE.md §6). 터치 버튼도 같은 keys 맵에 키 코드를 넣는다 ──
  // 조작: 이동 방향키 · W 드리블 · Q/E 감아차기 · D 슛·발차기 · S 뒷발차기 · A 필살기 · Z 패스
  var keys = Object.create(null);
  var KEY = {
    up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    dribble: ['KeyW'], curveL: ['KeyQ'], curveR: ['KeyE'], kick: ['KeyD'], back: ['KeyS'], ult: ['KeyA'], pass: ['KeyZ']
  };
  var stickVec = { active: false, dx: 0, dy: 0 };   // 터치 조이스틱
  function down(list) { for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true; return false; }
  function readInput(out) {
    var dx = (down(KEY.right) ? 1 : 0) - (down(KEY.left) ? 1 : 0);
    var dy = (down(KEY.down) ? 1 : 0) - (down(KEY.up) ? 1 : 0);
    if (stickVec.active) { dx = stickVec.dx; dy = stickVec.dy; }
    var b = 0;
    if (down(KEY.pass)) b |= BTN.PASS;
    if (down(KEY.kick)) b |= BTN.KICK;
    if (down(KEY.dribble)) b |= BTN.DRIBBLE;
    if (down(KEY.curveL)) b |= BTN.CURVE_L;
    if (down(KEY.curveR)) b |= BTN.CURVE_R;
    if (down(KEY.back)) b |= BTN.BACKKICK;
    if (down(KEY.ult)) b |= BTN.ULT;
    out.dx = dx; out.dy = dy; out.buttons = b;
    return out;
  }
  var PREVENT = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1, F3: 1 };
  window.addEventListener('keydown', function (e) {
    if (e.code === 'F3') { debugOn = !debugOn; $('debug').classList.toggle('show', debugOn); e.preventDefault(); return; }
    if (e.code === 'KeyM' && !overlayMode) { settings.minimap = !settings.minimap; saveSettings(); return; }
    if (PREVENT[e.code]) e.preventDefault();
    keys[e.code] = true;
    if (overlayMode) {
      if (e.code === 'Enter') startPractice({ char: settings.char });
      else if (e.code.indexOf('Digit') === 0) { var n = +e.code.slice(5); if (n >= 1 && n <= 6) selectChar(n - 1); }
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = Object.create(null); stickVec.active = false; });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ── 터치 조작 ──
  var touchOn = false;
  function setTouch(on) {
    touchOn = !!on;
    $('touch').classList.toggle('show', touchOn);

      case 'blink':    return '바라보는 쪽으로 ' + u.dist + '만큼 순간이동한다(공도 함께)';
      case 'charge':   return u.durTicks / 20 + '초간 기절하지 않고 부딪히는 상대를 넘어뜨린다';
      case 'dash':     return u.durTicks / 20 + '초간 ' + u.speedMul + '배로 달린다';
      case 'slow':     return u.durTicks / 20 + '초간 주변 ' + u.radius + ' 안의 상대를 느리게 만든다';
    }
    return '';
  }
  function showOverlay(final) {
    overlayMode = true;
    $('overlay').classList.add('show');
    $('ovFinal').style.display = final ? '' : 'none';
    if (final) {
      $('ovFinal').innerHTML = '<span style="color:var(--team-a)">' + TEAM_NAMES[0] + '</span> ' + final[0] + ' : ' + final[1] + ' <span style="color:var(--team-b)">' + TEAM_NAMES[1] + '</span>';
      $('ovSub').textContent = '경기 종료';
    } else $('ovSub').textContent = '연습장 — 골키퍼는 자동, 상대는 허수아비. 캐릭터를 고르고 시작하세요.';
    $('ovStart').textContent = final ? '다시 시작' : '시작';
    $('ovHint').innerHTML = touchOn
      ? '왼쪽 아래를 누른 채 끌면 이동 · 오른쪽 버튼으로 슛·드리블·감아차기'
      : '<kbd>1</kbd>~<kbd>6</kbd> 캐릭터 · <kbd>Enter</kbd> 시작<br>방향키 이동 · <kbd>W</kbd> 드리블 · <kbd>D</kbd> 슛/발차기 · <kbd>S</kbd> 뒷발 · <kbd>Q</kbd><kbd>E</kbd> 감아차기 · <kbd>Z</kbd> 패스 · <kbd>A</kbd> 필살기';
    renderOverlay();
  }
  function hideOverlay() { overlayMode = false; $('overlay').classList.remove('show'); }
  $('ovStart').addEventListener('click', function () { startPractice({ char: settings.char }); });

  // ── 연습장 모드: 같은 step 을 로컬에서 돌리고, 스냅샷으로 인코딩→디코딩해 렌더 경로를 온라인과 똑같이 탄다 ──
  var game = null;
  var injected = [];  // 디버그 입력 주입: 슬롯별 { dx, dy, buttons, left, resolve }
  var eventLog = [];
  var tickStats = { count: 0, msSum: 0, msMax: 0 };
  function startPractice(opts) {
    opts = opts || {};
    var state = core.createState({ halfSec: opts.halfSec || 150 });
    var charId = opts.char != null ? opts.char : settings.char;
    core.addPlayer(state, 0, 0, charId);
    var dummies = opts.dummies != null ? opts.dummies : 2;
    for (var i = 0; i < dummies; i++) {
      var d = core.addPlayer(state, 1 + i, 1, (charId + 1 + i) % 6);
      if (d) { d.x = 820 + (i % 3) * 70; d.y = 320 + Math.floor(i / 3) * 120 + (i % 3) * 60; }
    }
    core.startMatch(state);
    var inputs = [];
    for (i = 0; i < C.MAX_PLAYERS; i++) inputs[i] = { dx: 0, dy: 0, buttons: 0 };
    game = { mode: 'practice', state: state, inputs: inputs, mySlot: 0, acc: 0, last: performance.now(), interpMs: 50 };
    snaps.length = 0; injected.length = 0; eventLog.length = 0; animState.length = 0;
    cam.init = false;
    hideOverlay();
    doTick(performance.now());
    banner('킥오프', 1200);
  }
  function handleEvents(ev, tick) {
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (eventLog.length < 800) eventLog.push({ tick: tick, kind: e.kind, team: e.team, slot: e.slot, side: e.side, name: e.name });
      switch (e.kind) {
        case 'goal': banner('골! ' + TEAM_NAMES[e.team], 1800); break;
        case 'kickoff': banner('킥오프', 900); break;
        case 'play': $('banner').classList.remove('show'); break;
        case 'half': banner('하프타임', 3000); break;
        case 'end': banner('경기 종료', 2500); break;
        case 'lobby': showOverlay([game.state.score[0], game.state.score[1]]); break;
        case 'ult': if (game && e.slot === game.mySlot) banner(e.name + '!', 1200); break;
        case 'keeperSave': if (game) banner('골키퍼 선방!', 900); break;
      }
    }
  }
  function doTick(now) {
    var g = game, t0 = performance.now();
    for (var s = 0; s < C.MAX_PLAYERS; s++) {
      var inj = injected[s];
      if (inj && inj.left > 0) { g.inputs[s].dx = inj.dx; g.inputs[s].dy = inj.dy; g.inputs[s].buttons = inj.buttons; }
      else if (s === g.mySlot) readInput(g.inputs[s]);
      else { g.inputs[s].dx = 0; g.inputs[s].dy = 0; g.inputs[s].buttons = 0; }
    }
    var ev = core.step(g.state, g.inputs);
    handleEvents(ev, g.state.tick);
    for (s = 0; s < injected.length; s++) {
      inj = injected[s];
      if (inj && inj.left > 0 && --inj.left === 0 && inj.resolve) { var r = inj.resolve; inj.resolve = null; r(g.state.tick); }
    }
    var bytes = core.encodeSnapshot(g.state, now >>> 0, snapBuf);
    pushSnapshot(bytes, now);
    var ms = performance.now() - t0;
    tickStats.count++; tickStats.msSum += ms; if (ms > tickStats.msMax) tickStats.msMax = ms;
  }

  // ── 루프 ──
  var frameTimes = [], lastFrame = performance.now(), fps = 0, frameMs = 0;
  function frame(now) {
    var dt = now - lastFrame; lastFrame = now;
    // resize 이벤트를 놓친 경우(숨겨진 탭에서 돌아올 때 등)를 대비해 창 크기를 직접 확인
    if (view.cssW !== window.innerWidth || view.cssH !== window.innerHeight) resize();
    frameTimes.push(dt); if (frameTimes.length > 60) frameTimes.shift();
    var sum = 0; for (var i = 0; i < frameTimes.length; i++) sum += frameTimes[i];
    frameMs = sum / frameTimes.length; fps = frameMs > 0 ? 1000 / frameMs : 0;
    if (game) {
      game.acc += now - game.last; game.last = now;
      if (game.acc > 250) game.acc = 250;  // 탭 전환 뒤 따라잡기 상한 5틱
      while (game.acc >= 50) { doTick(now - game.acc + 50); game.acc -= 50; }
    }
    sample(now - (game ? game.interpMs : settings.interpMs));
    updateCamera(Math.min(0.1, dt / 1000));
    render(now);
    if (debugOn) renderDebug();
    requestAnimationFrame(frame);
  }
  function snapshotHz() {
    if (snaps.length < 2) return 0;
    var a = snaps[Math.max(0, snaps.length - 21)], b = snaps[snaps.length - 1], n = snaps.length - 1 - Math.max(0, snaps.length - 21);
    return b.t > a.t ? Math.round(n / ((b.t - a.t) / 1000) * 10) / 10 : 0;
  }
  function stats() {
    var g = game, me = myRenderPlayer();
    return {
      fps: Math.round(fps * 10) / 10, frameMs: Math.round(frameMs * 100) / 100,
      mode: g ? g.mode : 'idle', rtt: null, p90: null, interpMs: g ? g.interpMs : settings.interpMs,
      snapshotHz: snapshotHz(), snapshotBytes: lastSnapshotBytes, buffered: snaps.length,
      slot: g ? g.mySlot : null, room: null, touch: touchOn, sprite: sprite ? (sprite.STYLE || 'yes') : 'fallback',
      cam: { x: Math.round(cam.x), y: Math.round(cam.y), worldW: Math.round(view.worldW), worldH: Math.round(view.worldH), scale: Math.round(view.scale * 100) / 100 },
      drawn: (function () { var n = 0; for (var i = 0; i < rs.n; i++) if (onScreen(rs.players[i].x, rs.players[i].y, 80)) n++; return n; })(),
      ult: me ? Math.round(me.ult * 100) : 0, motion: me ? me.motionName : null,
      tick: g ? g.state.tick : 0, phase: g ? core.PHASE_NAME[g.state.phase] : 'none',
      tickMsAvg: tickStats.count ? Math.round(tickStats.msSum / tickStats.count * 1000) / 1000 : 0, tickMsMax: Math.round(tickStats.msMax * 1000) / 1000
    };
  }
  function renderDebug() {
    var st = stats();
    $('debug').textContent = 'fps ' + st.fps + '  frame ' + st.frameMs + 'ms' + (st.touch ? '  touch' : '') + '  sprite:' + st.sprite + '\n' +
      'mode ' + st.mode + '  tick ' + st.tick + '  phase ' + st.phase + '  motion ' + st.motion + '\n' +
      'cam ' + st.cam.x + ',' + st.cam.y + '  view ' + st.cam.worldW + '×' + st.cam.worldH + ' @' + st.cam.scale + '  그림 ' + st.drawn + '/' + rs.n + '\n' +
      'snapshot ' + st.snapshotBytes + 'B @' + st.snapshotHz + 'Hz  buffered ' + st.buffered + '  interp ' + st.interpMs + 'ms  필살 ' + st.ult + '%\n' +
      'tick ' + st.tickMsAvg + 'ms avg / ' + st.tickMsMax + 'ms max' + (game ? '\nhash ' + core.hashState(game.state) : '');
  }

  // ── 디버그·검증 API (CLAUDE.md §7) ──
  core.debug = {
    stats: stats,
    state: function () { return snaps.length ? JSON.parse(JSON.stringify(snaps[snaps.length - 1].s)) : null; },
    raw: function () { return game ? game.state : null; },
    hash: function () { return game ? core.hashState(game.state) : null; },
    events: function () { return eventLog.slice(); },
    setInput: function (partial, ticks) {
      if (!game) return Promise.reject(new Error('경기가 없다'));
      var slot = partial.slot || 0;
      return new Promise(function (resolve) {
        injected[slot] = { dx: partial.dx || 0, dy: partial.dy || 0, buttons: partial.buttons || 0, left: Math.max(1, ticks | 0), resolve: resolve };
      });
    },
    clearInput: function (slot) { injected[slot || 0] = null; return true; },
    readInput: function () { return readInput({ dx: 0, dy: 0, buttons: 0 }); },
    run: function (ticks) {
      if (!game) throw new Error('경기가 없다');
      // 동기 실행: 마지막 틱이 "지금"이 되도록 과거 시각으로 찍는다 (렌더러가 최신 스냅샷을 고르게)
      var from = eventLog.length, now = performance.now();
      for (var i = 0; i < ticks; i++) doTick(now - (ticks - 1 - i) * 50);
      game.acc = 0; game.last = performance.now();
      sample(performance.now());
      return eventLog.slice(from);
    },
    practice: function (opts) { startPractice(opts); return true; },
    setBall: function (x, y, vx, vy, range, spin) {
      if (!game) return false;
      var b = game.state.ball;
      b.x = x; b.y = y; b.vx = vx || 0; b.vy = vy || 0;
      b.range = range != null ? range : ((vx || vy) ? 2200 : 0); b.spin = spin || 0; b.pierce = 0;
      b.owner = -1; b.kickCd = 0; b.keeperCd = 0; return true;
    },
    setPlayer: function (slot, x, y, facing) {
      var p = game && game.state.players[slot]; if (!p) return false;
      p.x = x; p.y = y; if (facing != null) p.facing = facing; p.vx = 0; p.vy = 0; return true;
    },
    fillUlt: function (slot) { var p = game && game.state.players[slot || 0]; if (!p) return false; p.ult = core.TUNING.ult.fullTicks; return true; },
    camera: function () { return { x: cam.x, y: cam.y, worldW: view.worldW, worldH: view.worldH, scale: view.scale }; },
    minimap: function (on) { settings.minimap = !!on; saveSettings(); return settings.minimap; },
    touch: function (on) { setTouch(on); return touchOn; },
    selfTest: function (seed, ticks) { return core.selfTest(seed, ticks); },
    // 숨겨진 탭(rAF 정지)에서도 렌더 경로를 검증할 수 있게 한 프레임을 동기로 그린다
    renderOnce: function (frames) {
      var n = Math.max(1, frames | 0), t0 = performance.now(), now = performance.now();
      for (var i = 0; i < n; i++) { sample(now + i * 16.7 - (game ? game.interpMs : settings.interpMs)); updateCamera(0.0167); render(now + i * 16.7); }
      return { frames: n, msPerFrame: Math.round((performance.now() - t0) / n * 1000) / 1000 };
    },
    renderAt: function (offsetMs, base) {
      var t = (base || performance.now()) + (game ? game.interpMs : settings.interpMs) + (offsetMs || 0);
      sample(t - (game ? game.interpMs : settings.interpMs)); updateCamera(1); render(t); return true;
    },
    screenshot: function (offsetMs) {
      core.debug.renderAt(offsetMs || 0);
      var off = document.createElement('canvas'); off.width = canvas.width; off.height = canvas.height;
      var o = off.getContext('2d'); o.fillStyle = COLOR.bg; o.fillRect(0, 0, off.width, off.height); o.drawImage(canvas, 0, 0);
      return off.toDataURL('image/png');
    },
    resize: resize,
    latencyProbe: function () { return Promise.reject(new Error('2단계: 온라인 모드에서만 측정한다')); },
    connect: function () { throw new Error('2단계에서 구현'); },
    disconnect: function () { throw new Error('2단계에서 구현'); }
  };

  showOverlay(null);
  requestAnimationFrame(frame);

  // ?selftest=1 : 헤드리스 브라우저(file:// 검증용)가 DOM 만 읽어도 결과를 알 수 있게 #debug 에 JSON 을 쓴다
  if (params.get('selftest') === '1') {
    var report = { protocol: location.protocol, sprite: sprite ? (sprite.STYLE || 'yes') : 'fallback', errors: [] };
    window.addEventListener('error', function (e) { report.errors.push(String(e.message)); $('debug').textContent = JSON.stringify(report); });
    try {
      report.selfTest = core.selfTest(1, 600).hash;
      core.debug.practice({ char: 0, dummies: 2, halfSec: 90 });
      core.debug.run(100);
      report.tick = game.state.tick; report.phase = core.PHASE_NAME[game.state.phase];
      report.renderMs = core.debug.renderOnce(30).msPerFrame;
      report.cam = core.debug.camera();
      report.store = (function () { store.set('soc_probe', '1'); var v = store.get('soc_probe'); store.remove('soc_probe'); return v === '1'; })();
    } catch (e) { report.errors.push(String(e && e.stack || e)); }
    $('debug').textContent = JSON.stringify(report);
    $('debug').classList.add('show');
  }
})();
</script>
</body>
</html>
